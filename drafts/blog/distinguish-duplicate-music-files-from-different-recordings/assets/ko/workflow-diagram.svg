<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">지우기 전에 비교해요</title>
<desc id="desc">파일·발매판·녹음은 서로 달라요. 확실하지 않은 복사본은 보존해요.</desc>
<rect width="800" height="1100" fill="#faf8f3"/>
<text x="50" y="80" font-size="30" fill="#252d29">지우기 전에 비교해요</text>
<text x="50" y="125" font-size="20" fill="#4a5550">파일·발매판·녹음은 서로 달라요</text>
<rect x="50" y="180" width="700" height="145" rx="14" fill="#ffffff" stroke="#9aafa3"/>
<text x="80" y="230" font-size="27" fill="#252d29">1. 보존</text>
<text x="80" y="280" font-size="23" fill="#4a5550">원본과 백업을 남겨요.</text>
<path d="M400 330 v30 m-9 -9 l9 9 9 -9" fill="none" stroke="#486b58" stroke-width="3"/>
<rect x="50" y="375" width="700" height="145" rx="14" fill="#ffffff" stroke="#9aafa3"/>
<text x="80" y="425" font-size="27" fill="#252d29">2. 비교</text>
<text x="80" y="475" font-size="23" fill="#4a5550">발매판과 출처를 확인해요.</text>
<path d="M400 525 v30 m-9 -9 l9 9 9 -9" fill="none" stroke="#486b58" stroke-width="3"/>
<rect x="50" y="570" width="700" height="145" rx="14" fill="#ffffff" stroke="#9aafa3"/>
<text x="80" y="620" font-size="27" fill="#252d29">3. 듣기</text>
<text x="80" y="670" font-size="23" fill="#4a5550">같은 구간을 비교해요.</text>
<path d="M400 720 v30 m-9 -9 l9 9 9 -9" fill="none" stroke="#486b58" stroke-width="3"/>
<rect x="50" y="765" width="700" height="145" rx="14" fill="#ffffff" stroke="#9aafa3"/>
<text x="80" y="815" font-size="27" fill="#252d29">4. 기록</text>
<text x="80" y="865" font-size="23" fill="#4a5550">근거와 의문을 남겨요.</text>
<text x="50" y="1045" font-size="24" fill="#252d29">확실하지 않은 복사본은 보존해요.</text>
</svg>
