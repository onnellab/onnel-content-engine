<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" role="img" aria-labelledby="title desc" lang="fr">
<title id="title">Comparer avant de supprimer</title>
<desc id="desc">Fichier, édition et enregistrement diffèrent. Gardez les copies incertaines.</desc>
<rect width="800" height="1100" fill="#faf8f3"/>
<text x="50" y="80" font-size="30" fill="#252d29">Comparer avant de supprimer</text>
<text x="50" y="125" font-size="20" fill="#4a5550">Fichier, édition et enregistrement diffèrent</text>
<rect x="50" y="180" width="700" height="145" rx="14" fill="#ffffff" stroke="#9aafa3"/>
<text x="80" y="230" font-size="27" fill="#252d29">1. Garder</text>
<text x="80" y="280" font-size="23" fill="#4a5550">Conservez les originaux.</text>
<path d="M400 330 v30 m-9 -9 l9 9 9 -9" fill="none" stroke="#486b58" stroke-width="3"/>
<rect x="50" y="375" width="700" height="145" rx="14" fill="#ffffff" stroke="#9aafa3"/>
<text x="80" y="425" font-size="27" fill="#252d29">2. Comparer</text>
<text x="80" y="475" font-size="23" fill="#4a5550">Vérifiez édition et source.</text>
<path d="M400 525 v30 m-9 -9 l9 9 9 -9" fill="none" stroke="#486b58" stroke-width="3"/>
<rect x="50" y="570" width="700" height="145" rx="14" fill="#ffffff" stroke="#9aafa3"/>
<text x="80" y="620" font-size="27" fill="#252d29">3. Écouter</text>
<text x="80" y="670" font-size="23" fill="#4a5550">Comparez le même passage.</text>
<path d="M400 720 v30 m-9 -9 l9 9 9 -9" fill="none" stroke="#486b58" stroke-width="3"/>
<rect x="50" y="765" width="700" height="145" rx="14" fill="#ffffff" stroke="#9aafa3"/>
<text x="80" y="815" font-size="27" fill="#252d29">4. Noter</text>
<text x="80" y="865" font-size="23" fill="#4a5550">Gardez preuves et doutes.</text>
<text x="50" y="1045" font-size="24" fill="#252d29">Gardez les copies incertaines.</text>
</svg>
