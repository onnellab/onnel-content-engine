name: Collect Store Policy Updates
on: {schedule: [{cron: '05 0 * * *'}], workflow_dispatch: {}}
permissions: {contents: write}
jobs:
 collect:
  runs-on: ubuntu-latest
  env:
   GMAIL_CLIENT_ID: ${{ secrets.GMAIL_POLICY_ALERT_CLIENT_ID }}
   GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_POLICY_ALERT_CLIENT_SECRET }}
   GMAIL_POLICY_REFRESH_DEVELOPER: ${{ secrets.GMAIL_POLICY_ALERT_REFRESH_TOKEN_DEVELOPER }}
   GMAIL_POLICY_REFRESH_OFFICIAL: ${{ secrets.GMAIL_POLICY_ALERT_REFRESH_TOKEN_OFFICIAL }}
  steps:
   - uses: actions/checkout@v4
   - run: python3 scripts/collect_store_policy_updates.py
   - name: Collect developer-account policy mail
     id: collect_developer
     if: env.GMAIL_POLICY_REFRESH_DEVELOPER != ''
     continue-on-error: true
     run: python3 scripts/collect_gmail_policy_alerts.py
     env:
      GMAIL_ACCOUNT_ALIAS: developer
      GMAIL_REFRESH_TOKEN: ${{ env.GMAIL_POLICY_REFRESH_DEVELOPER }}
   - name: Collect official-account policy mail
     id: collect_official
     if: env.GMAIL_POLICY_REFRESH_OFFICIAL != ''
     continue-on-error: true
     run: python3 scripts/collect_gmail_policy_alerts.py
     env:
      GMAIL_ACCOUNT_ALIAS: official
      GMAIL_REFRESH_TOKEN: ${{ env.GMAIL_POLICY_REFRESH_OFFICIAL }}
   - run: python3 scripts/analyze_store_policy_impact.py
   - run: |
      git config user.name github-actions[bot]
      git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      git add data/store_policy_watchlist.json data/store_policy_alerts.json data/gmail_policy_alert_sync_status.json data/store_policy_impact_tasks.json
      git diff --cached --quiet || git commit -m "Collect store policy update status"
      git push
   - name: Fail when a configured mailbox could not be collected
     if: steps.collect_developer.outcome == 'failure' || steps.collect_official.outcome == 'failure'
     run: exit 1
