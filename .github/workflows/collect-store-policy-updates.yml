name: Collect Store Policy Updates
on: {schedule: [{cron: '05 0 * * *'}], workflow_dispatch: {}}
permissions: {contents: write}
jobs:
 collect:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - run: python3 scripts/collect_store_policy_updates.py
   - run: python3 scripts/analyze_store_policy_impact.py
   - run: |
      git config user.name github-actions[bot]
      git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      git add data/store_policy_watchlist.json data/store_policy_impact_tasks.json
      git diff --cached --quiet || git commit -m "Collect store policy update status"
      git push
