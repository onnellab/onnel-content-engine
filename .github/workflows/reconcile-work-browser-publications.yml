name: Reconcile Work Browser Publications

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/work_browser_publications.json
      - scripts/reconcile_work_browser_publications.py
      - .github/workflows/reconcile-work-browser-publications.yml
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: onnellab-manual-dashboard-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOMEPAGE_REPO_PATH: .homepage
    steps:
      - name: Checkout content engine
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ONNELLAB_GITHUB_PAGES_TOKEN || github.token }}

      - name: Checkout homepage
        uses: actions/checkout@v4
        with:
          repository: onnellab/onnellab.github.io
          path: ${{ env.HOMEPAGE_REPO_PATH }}
          token: ${{ secrets.ONNELLAB_GITHUB_PAGES_TOKEN || github.token }}

      - name: Refresh main before dashboard mutation
        run: git pull --ff-only origin main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconcile browser publication results
        run: |
          set -euo pipefail
          python3 scripts/reconcile_work_browser_publications.py
          python3 scripts/build_manual_publish_site.py --homepage-repo "$HOMEPAGE_REPO_PATH" --store-review-triage /tmp/work-browser-triage.json
          python3 scripts/validate_manual_publish_site.py generated/manual-publish/index.html
          git diff --check

      - name: Commit publication state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/work_browser_publications.json data/manual_publish_state.json generated/manual-publish/
          if git diff --cached --quiet; then
            echo "No new Work browser publication results"
          else
            git commit -m "Reconcile Work browser publications"
            git pull --rebase origin main
            python3 scripts/validate_manual_publish_site.py generated/manual-publish/index.html
            git diff --check
            git push origin HEAD:main
          fi

      - name: Deploy dashboard
        run: |
          set -euo pipefail
          git -C "$HOMEPAGE_REPO_PATH" pull --rebase origin main
          mkdir -p "$HOMEPAGE_REPO_PATH/public/manual-publish"
          cp generated/manual-publish/index.html "$HOMEPAGE_REPO_PATH/public/manual-publish/index.html"
          cp generated/manual-publish/manifest.webmanifest "$HOMEPAGE_REPO_PATH/public/manual-publish/manifest.webmanifest"
          cp generated/manual-publish/sw.js "$HOMEPAGE_REPO_PATH/public/manual-publish/sw.js"
          cp generated/manual-publish/icon-180.png "$HOMEPAGE_REPO_PATH/public/manual-publish/icon-180.png"
          cp generated/manual-publish/icon-192.png "$HOMEPAGE_REPO_PATH/public/manual-publish/icon-192.png"
          cp generated/manual-publish/icon-512.png "$HOMEPAGE_REPO_PATH/public/manual-publish/icon-512.png"
          cp generated/manual-publish/libsodium-sumo.js "$HOMEPAGE_REPO_PATH/public/manual-publish/libsodium-sumo.js"
          cp generated/manual-publish/libsodium-wrappers.js "$HOMEPAGE_REPO_PATH/public/manual-publish/libsodium-wrappers.js"
          python3 scripts/validate_manual_publish_site.py "$HOMEPAGE_REPO_PATH/public/manual-publish/index.html"
          git -C "$HOMEPAGE_REPO_PATH" diff --check
          git -C "$HOMEPAGE_REPO_PATH" config user.name "github-actions[bot]"
          git -C "$HOMEPAGE_REPO_PATH" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$HOMEPAGE_REPO_PATH" add public/manual-publish/
          if git -C "$HOMEPAGE_REPO_PATH" diff --cached --quiet; then
            echo "No dashboard changes"
          else
            git -C "$HOMEPAGE_REPO_PATH" commit -m "Refresh Work publication dashboard"
            git -C "$HOMEPAGE_REPO_PATH" push origin HEAD:main
          fi
