name: Offline store release tool verification (temporary)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-store-release-tools.yml'
permissions:
  contents: read
jobs:
  test:
    name: Test private release implementation offline
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout approved source (no persisted credentials)
        uses: actions/checkout@v4
        with:
          repository: onnellab/codex-config
          ref: master
          path: release-tool-source
          persist-credentials: false
          token: ${{ secrets.ONNELLAB_RELEASE_TOKEN || secrets.ONNELLAB_GITHUB_PAGES_TOKEN }}
      - name: Verify Python syntax
        working-directory: release-tool-source
        run: |
          set -euo pipefail
          python3 -m py_compile release-tools/onnellab_store_upload.py release-tools/onnellab_store_publish.py release-tools/onnellab_store_listing.py install/test_ios_release_notes.py install/test_release_tools.py
      - name: Test Apple's What's New contract with mocked provider
        working-directory: release-tool-source
        run: python3 -m unittest discover -s install -p 'test_ios_release_notes.py' -v
      - name: Test existing signing and Google Play uploader behavior
        working-directory: release-tool-source
        run: python3 -m unittest discover -s install -p 'test_release_tools.py' -v
