name: Record Internal Test Feedback
on:
  workflow_dispatch:
    inputs:
      release_id: {description: Successfully uploaded private-test release ID, required: true, type: string}
      kind: {description: crash, data_loss, security, bug, performance, or usability, required: true, type: choice, options: [crash, data_loss, security, bug, performance, usability]}
      summary: {description: Short issue summary. Do not include personal data, passwords, tokens, or files., required: true, type: string}
      reproduction: {description: Reproduction steps only. Do not include personal data, passwords, tokens, or files., required: true, type: string}
      confirm: {description: Type TEST_FEEDBACK to record this report, required: true, type: string}
permissions: {contents: write}
jobs:
  record:
    if: inputs.confirm == 'TEST_FEEDBACK'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record tester feedback
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          KIND: ${{ inputs.kind }}
          SUMMARY: ${{ inputs.summary }}
          REPRODUCTION: ${{ inputs.reproduction }}
        run: python3 scripts/record_internal_test_feedback.py "$RELEASE_ID" --kind "$KIND" --summary "$SUMMARY" --reproduction "$REPRODUCTION"
      - run: python3 scripts/analyze_internal_test_feedback.py
      - run: python3 scripts/generate_ai_coder_tasks.py
      - run: python3 scripts/generate_ai_manager_report.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/internal_test_feedback.json data/internal_test_findings.json data/ai_coder_tasks.json data/ai_manager_daily_report.json
          git diff --cached --quiet || git commit -m "Record internal test feedback"
          git push
