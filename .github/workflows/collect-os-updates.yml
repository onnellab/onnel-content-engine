name: Collect OS Updates
on:
  schedule: [{cron: '10 0 * * *'}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/collect_os_updates.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/os_update_watchlist.json
          git diff --cached --quiet || git commit -m "Collect OS update status"
          git push
