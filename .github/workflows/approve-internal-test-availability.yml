name: Approve Internal Test Availability
on:
  workflow_dispatch:
    inputs:
      release_id: {description: Successfully uploaded private-test release ID, required: true, type: string}
      approver: {description: Human confirmer, required: true, type: string}
      evidence_url: {description: HTTPS link to Play/TestFlight console evidence, required: true, type: string}
      confirm: {description: Type AVAILABLE_TO_TESTERS to record, required: true, type: string}
permissions: {contents: write}
jobs:
  approve:
    if: inputs.confirm == 'AVAILABLE_TO_TESTERS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          RELEASE_ID: ${{ inputs.release_id }}
          APPROVER: ${{ inputs.approver }}
          EVIDENCE_URL: ${{ inputs.evidence_url }}
        run: python3 scripts/approve_internal_test_availability.py "$RELEASE_ID" --approver "$APPROVER" --evidence-url "$EVIDENCE_URL" --confirm
      - run: python3 scripts/generate_ai_manager_report.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/internal_test_availability.json data/ai_manager_daily_report.json
          git diff --cached --quiet || git commit -m "Confirm internal test availability"
          git push
