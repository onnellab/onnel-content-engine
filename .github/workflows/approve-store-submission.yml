name: Approve Store Submission

on:
  workflow_dispatch:
    inputs:
      release_id: {description: Public binary release ID, required: true, type: string}
      task_id: {description: QA-passed AI-Coder task ID, required: true, type: string}
      approver: {description: Human approver name, required: true, type: string}
      confirm: {description: Type SUBMIT to approve preparation only, required: true, type: string}

permissions: {contents: write}
jobs:
  approve:
    if: inputs.confirm == 'SUBMIT'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/approve_store_submission.py '${{ inputs.release_id }}' --task-id '${{ inputs.task_id }}' --approver '${{ inputs.approver }}' --confirm
      - run: python3 scripts/evaluate_store_submission_readiness.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/store_submission_approvals.json data/store_submission_readiness.json
          git diff --cached --quiet || git commit -m "Approve store submission preparation"
          git push
