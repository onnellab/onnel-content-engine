name: Audit Store Review State
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audit-store-reviews
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compare saved reviews with authenticated store sources
        env:
          APP_STORE_CONNECT_READ_KEY_TYPE: ${{ secrets.APP_STORE_CONNECT_READ_KEY_TYPE }}
          APP_STORE_CONNECT_READ_KEY_ID: ${{ secrets.APP_STORE_CONNECT_READ_KEY_ID }}
          APP_STORE_CONNECT_READ_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_READ_ISSUER_ID }}
          APP_STORE_CONNECT_READ_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_READ_PRIVATE_KEY_BASE64 }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_TOKEN: ${{ secrets.APP_STORE_CONNECT_TOKEN }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          GOOGLE_PLAY_REPORTS_BUCKET: ${{ secrets.GOOGLE_PLAY_REPORTS_BUCKET }}
        run: python3 scripts/audit_store_reviews.py --output audit/store-review-state.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-review-state
          path: audit/store-review-state.json
          retention-days: 3
          if-no-files-found: error
