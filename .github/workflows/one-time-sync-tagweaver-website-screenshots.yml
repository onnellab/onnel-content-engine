name: One-time TagWeaver website screenshot sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-sync-tagweaver-website-screenshots.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: one-time-tagweaver-website-screenshot-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.AI_CODER_GITHUB_TOKEN }}
    steps:
      - name: Cancel superseded queued attempts
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST repos/onnellab/onnellab.github.io/actions/runs/33050201355/cancel >/dev/null 2>&1 || true
          gh api --method POST repos/onnellab/tagweaver/actions/runs/33050437703/cancel >/dev/null 2>&1 || true

      - name: Checkout automation repository
        uses: actions/checkout@v4
        with:
          path: engine
          ref: main
          fetch-depth: 0

      - name: Checkout latest TagWeaver main
        uses: actions/checkout@v4
        with:
          repository: onnellab/tagweaver
          token: ${{ secrets.AI_CODER_GITHUB_TOKEN }}
          path: source
          ref: main
          fetch-depth: 0

      - name: Checkout latest website main
        uses: actions/checkout@v4
        with:
          repository: onnellab/onnellab.github.io
          token: ${{ secrets.AI_CODER_GITHUB_TOKEN }}
          path: website
          ref: main
          fetch-depth: 0

      - name: Replace all localized TagWeaver landing screenshots
        id: copy
        shell: bash
        run: |
          set -euo pipefail

          source_root="source/assets/store_promo/generated"
          target_root="website/src/content/apps/tagweaver/assets/screenshots"
          locales=(en ko ja zh-Hant zh-Hans pt-BR de fr es)
          copied=0

          for locale in "${locales[@]}"; do
            mkdir -p "$target_root/$locale"
            for index in 1 2 3 4 5 6; do
              printf -v source_name '%02d.png' "$index"
              source_path="$source_root/$locale/android/$source_name"
              target_path="$target_root/$locale/$index.png"
              test -s "$source_path"
              cp "$source_path" "$target_path"
              cmp --silent "$source_path" "$target_path"
              copied=$((copied + 1))
            done
          done

          [[ "$copied" -eq 54 ]]

          python3 - <<'PY'
          from pathlib import Path
          import struct

          root = Path('website/src/content/apps/tagweaver/assets/screenshots')
          locales = ['en', 'ko', 'ja', 'zh-Hant', 'zh-Hans', 'pt-BR', 'de', 'fr', 'es']
          files = [root / locale / f'{index}.png' for locale in locales for index in range(1, 7)]
          assert len(files) == 54
          for path in files:
              data = path.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', f'Invalid PNG: {path}'
              width, height = struct.unpack('>II', data[16:24])
              assert (width, height) == (1080, 2168), f'Unexpected dimensions for {path}: {width}x{height}'
          print(f'Validated {len(files)} PNG screenshots at 1080x2168.')
          PY

          changed_count="$(git -C website diff --name-only -- src/content/apps/tagweaver/assets/screenshots | sed '/^$/d' | wc -l | tr -d ' ')"
          source_asset_sha="$(git -C source log -1 --format=%H -- assets/store_promo/generated)"
          test -n "$source_asset_sha"
          echo "changed_count=$changed_count" >> "$GITHUB_OUTPUT"
          echo "source_asset_sha=$source_asset_sha" >> "$GITHUB_OUTPUT"
          echo "Copied 54 files; $changed_count differ from website main."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Verify Astro production build
        shell: bash
        working-directory: website
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Commit and push website main
        id: website_commit
        shell: bash
        env:
          SOURCE_ASSET_SHA: ${{ steps.copy.outputs.source_asset_sha }}
        run: |
          set -euo pipefail

          git -C website config user.name "ONNELLAB"
          git -C website config user.email "akinstun21@gmail.com"
          git -C website add src/content/apps/tagweaver/assets/screenshots
          git -C website diff --cached --check

          if git -C website diff --cached --quiet; then
            commit_sha="$(git -C website rev-parse HEAD)"
            echo "Website already matched the latest TagWeaver assets."
          else
            git -C website commit \
              -m "chore: sync TagWeaver promotional screenshots" \
              -m "Source assets: onnellab/tagweaver@${SOURCE_ASSET_SHA}"
            git -C website pull --rebase origin main
            git -C website push origin HEAD:main
            commit_sha="$(git -C website rev-parse HEAD)"
          fi

          echo "sha=$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Remove this one-time automation workflow
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail

          rm -f engine/.github/workflows/one-time-sync-tagweaver-website-screenshots.yml
          git -C engine config user.name "ONNELLAB"
          git -C engine config user.email "akinstun21@gmail.com"
          git -C engine add .github/workflows/one-time-sync-tagweaver-website-screenshots.yml
          git -C engine diff --cached --check
          git -C engine commit -m "chore: remove one-time TagWeaver screenshot sync"
          git -C engine pull --rebase origin main
          git -C engine push origin HEAD:main
          echo "sha=$(git -C engine rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Summarize
        shell: bash
        env:
          WEBSITE_SHA: ${{ steps.website_commit.outputs.sha }}
          CLEANUP_SHA: ${{ steps.cleanup.outputs.sha }}
          CHANGED_COUNT: ${{ steps.copy.outputs.changed_count }}
          SOURCE_ASSET_SHA: ${{ steps.copy.outputs.source_asset_sha }}
        run: |
          {
            echo "## TagWeaver website screenshot sync"
            echo "- Source assets: \`onnellab/tagweaver@${SOURCE_ASSET_SHA}\`"
            echo "- Locales: 9"
            echo "- Screenshots validated: 54"
            echo "- Changed website screenshot files: ${CHANGED_COUNT}"
            echo "- Website commit: \`${WEBSITE_SHA}\`"
            echo "- Automation cleanup commit: \`${CLEANUP_SHA}\`"
            echo "- \`npm run build\`: passed"
          } >> "$GITHUB_STEP_SUMMARY"
