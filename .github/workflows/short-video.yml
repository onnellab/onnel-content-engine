name: Isolated short-video checks
on:
  push:
    branches: [main]
    paths: ['video/**', 'scripts/short_video*.py', 'tests/test_short_video*.py', 'data/video_briefs/**', 'data/video_publish_policy.json', 'data/video_recording_scenarios.json', '.github/workflows/short-video.yml']
  pull_request:
    paths: ['video/**', 'scripts/short_video*.py', 'tests/test_short_video*.py', 'data/video_briefs/**', 'data/video_publish_policy.json', 'data/video_recording_scenarios.json', '.github/workflows/short-video.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: video/package-lock.json
      - run: python -m pip install -r requirements-test.txt
      - run: npm --prefix video ci
      - run: npm --prefix video run typecheck
      - run: npm --prefix video test
      - run: python -B scripts/run_unit_tests.py --pattern 'test_short_video*.py'
      - run: git diff --exit-code
