name: Merge Approved App PR
on:
  workflow_dispatch:
    inputs:
      task_id: {description: QA-passed task ID, required: true, type: string}
      approver: {description: Human merger name, required: true, type: string}
      confirm_merge: {description: Type MERGE to authorize squash merge, required: true, type: string}
permissions: {contents: write, pull-requests: write}
jobs:
  merge:
    if: inputs.confirm_merge == 'MERGE'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: merge
        name: Resolve QA-passed Coder PR
        env:
          TASK_ID: ${{ inputs.task_id }}
        run: python3 scripts/prepare_ai_pr_merge.py "$TASK_ID" --github-output "$GITHUB_OUTPUT"
      - name: Merge one approved PR
        id: merge_pr
        env:
          GH_TOKEN: ${{ secrets.ONNELLAB_GITHUB_PAGES_TOKEN || github.token }}
          REPOSITORY: ${{ steps.merge.outputs.repository }}
          PR_NUMBER: ${{ steps.merge.outputs.pr_number }}
        run: |
          gh pr ready "$PR_NUMBER" --repo "$REPOSITORY"
          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --squash --delete-branch
          merge_commit="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json mergeCommit --jq '.mergeCommit.oid')"
          echo "merge_commit=$merge_commit" >> "$GITHUB_OUTPUT"
      - name: Record merge approval
        env:
          TASK_ID: ${{ inputs.task_id }}
          REPOSITORY: ${{ steps.merge.outputs.repository }}
          PR_NUMBER: ${{ steps.merge.outputs.pr_number }}
          APPROVER: ${{ inputs.approver }}
          MERGE_COMMIT: ${{ steps.merge_pr.outputs.merge_commit }}
        run: python3 scripts/record_ai_coder_merge.py "$TASK_ID" --repository "$REPOSITORY" --pr-number "$PR_NUMBER" --approver "$APPROVER" --merge-commit "$MERGE_COMMIT"
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/ai_coder_tasks.json data/ai_merge_approvals.json
          git diff --cached --quiet || git commit -m "Record approved app PR merge"
          git push
