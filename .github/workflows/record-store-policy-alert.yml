name: Record Store Policy Alert

on:
  workflow_dispatch:
    inputs:
      store: {description: google_play or app_store, required: true, type: choice, options: [google_play, app_store]}
      app_slug: {description: App slug, required: true, type: string}
      kind: {description: Alert type, required: true, type: choice, options: [warning, rejection, deadline, metadata, privacy, billing, other]}
      summary: {description: Sanitized alert summary; no personal/account data, required: true, type: string}
      reference_url: {description: Optional official HTTPS URL, required: false, type: string}
      occurred_at: {description: Optional ISO-8601 timestamp, required: false, type: string}
      event_key: {description: Optional stable deduplication key, required: false, type: string}
      confirm_alert: {description: Type ALERT to record, required: true, type: string}

permissions: {contents: write}

jobs:
  record:
    if: inputs.confirm_alert == 'ALERT'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          python3 scripts/import_store_policy_alert.py
          --store '${{ inputs.store }}'
          --app-slug '${{ inputs.app_slug }}'
          --kind '${{ inputs.kind }}'
          --summary '${{ inputs.summary }}'
          --reference-url '${{ inputs.reference_url }}'
          --occurred-at '${{ inputs.occurred_at }}'
          --event-key '${{ inputs.event_key }}'
      - run: python3 scripts/analyze_store_policy_impact.py
      - run: python3 scripts/generate_ai_manager_report.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/store_policy_alerts.json data/store_policy_impact_tasks.json data/ai_manager_daily_report.json
          git diff --cached --quiet || git commit -m "Record store policy alert"
          git push
