name: Publish Approved Store Review Reply

on:
  workflow_dispatch:
    inputs:
      approval_id:
        description: Exact queued approval ID (PUBLISH) or registered revision ID (REPLACE)
        required: true
        type: string
      confirm_publish:
        description: Type PUBLISH for a new answer or REPLACE for an existing reviewed reply (owner only)
        required: true
        type: string

permissions:
  contents: write
concurrency:
  group: onnellab-manual-dashboard-writer
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (inputs.confirm_publish == 'PUBLISH' && !startsWith(inputs.approval_id, 'revision-')) ||
      (inputs.confirm_publish == 'REPLACE' && startsWith(inputs.approval_id, 'revision-') &&
       github.actor == 'onnellab')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - name: Publish approved new reply or owner-requested same-review replacement
        id: publish_reply
        continue-on-error: true
        env:
          APP_STORE_CONNECT_READ_KEY_TYPE: ${{ secrets.APP_STORE_CONNECT_READ_KEY_TYPE }}
          APP_STORE_CONNECT_READ_KEY_ID: ${{ secrets.APP_STORE_CONNECT_READ_KEY_ID }}
          APP_STORE_CONNECT_READ_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_READ_ISSUER_ID }}
          APP_STORE_CONNECT_READ_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_READ_PRIVATE_KEY_BASE64 }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_TOKEN: ${{ secrets.APP_STORE_CONNECT_TOKEN }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          REVIEW_RECORD_ID: ${{ inputs.approval_id }}
          REVIEW_CONFIRM_MODE: ${{ inputs.confirm_publish }}
        run: |
          set -euo pipefail
          if [ "$REVIEW_CONFIRM_MODE" = "REPLACE" ]; then
            python3 scripts/publish_store_review_reply.py "$REVIEW_RECORD_ID" --confirm-replace
          else
            python3 scripts/publish_store_review_reply.py "$REVIEW_RECORD_ID" --confirm-publish
          fi
      - name: Commit publication audit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/store_review_approvals.json data/store_review_reply_revisions.json
          git diff --cached --quiet || git commit -m "Publish approved store review reply"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
      - name: Fail when publication failed
        if: steps.publish_reply.outcome == 'failure'
        run: exit 1
