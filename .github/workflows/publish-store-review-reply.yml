name: Publish Approved Store Review Reply

on:
  workflow_dispatch:
    inputs:
      approval_id:
        description: Exact queued approval ID
        required: true
        type: string
      confirm_publish:
        description: Type PUBLISH to authorize the external store write
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    if: inputs.confirm_publish == 'PUBLISH'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - name: Publish exactly one approved reply
        id: publish_reply
        continue-on-error: true
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: python3 scripts/publish_store_review_reply.py "${{ inputs.approval_id }}" --confirm-publish
      - name: Commit publication audit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/store_review_approvals.json
          git diff --cached --quiet || git commit -m "Publish approved store review reply"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
      - name: Fail when publication failed
        if: steps.publish_reply.outcome == 'failure'
        run: exit 1
