name: Check Store Submission Credentials
on:
  workflow_dispatch:
    inputs:
      provider: {description: Credential provider, required: true, type: choice, options: [google_play, app_store]}
      confirm: {description: Type CREDENTIALS to run local shape validation, required: true, type: string}
permissions: {contents: read}
jobs:
  check:
    if: inputs.confirm == 'CREDENTIALS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_store_submission_credentials.py '${{ inputs.provider }}'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
