name: Retry Private Test Orchestration
on:
  workflow_dispatch:
    inputs:
      orchestration_id: {description: Failed private-test orchestration ID, required: true, type: string}
      approver: {description: Human retry approver, required: true, type: string}
      confirm: {description: Type RETRY_PRIVATE_TEST to resume from safe evidence, required: true, type: string}
permissions: {contents: write, actions: write}
jobs:
  retry:
    if: inputs.confirm == 'RETRY_PRIVATE_TEST'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          ORCHESTRATION_ID: ${{ inputs.orchestration_id }}
          APPROVER: ${{ inputs.approver }}
        run: python3 scripts/retry_private_test_orchestration.py "$ORCHESTRATION_ID" --approver "$APPROVER" --confirm
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/private_test_orchestrations.json data/private_test_build_requests.json data/codemagic_builds.csv
          git commit -m "Retry private test orchestration"
          git push
      - env:
          GH_TOKEN: ${{ secrets.ONNELLAB_GITHUB_PAGES_TOKEN || github.token }}
        run: gh workflow run advance-private-test-orchestration.yml
