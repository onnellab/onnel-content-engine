name: Sync app operational status
run-name: ${{ inputs.artwork_read_only && 'Read-only artwork access probe' || (inputs.artwork_check_only || github.event_name == 'schedule') && 'Check reviewed artwork changes' || 'Sync app operational status' }}

on:
  workflow_dispatch:
    inputs:
      artwork_check_only:
        description: Update only when a current reviewed artwork candidate changes; otherwise no remote writes
        required: false
        default: false
        type: boolean
      artwork_read_only:
        description: Read-only artwork repository access test; skips all publication and status writes
        required: false
        default: false
        type: boolean
      deploy_dashboard:
        description: "Build and deploy /ops/ after syncing app status"
        required: false
        default: true
        type: boolean

concurrency:
  group: onnellab-manual-dashboard-writer
  cancel-in-progress: false

env:
  ONNELLAB_OPS_PASSWORD: ${{ secrets.ONNELLAB_OPS_PASSWORD }}

jobs:
  sync:
    name: Refresh app versions and dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      HOMEPAGE_REPO_PATH: .homepage
      ARTWORK_CHECK_ONLY: ${{ inputs.artwork_read_only != true && (inputs.artwork_check_only == true || github.event_name == 'schedule') }}
      DEPLOY_DASHBOARD: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_dashboard }}

    steps:
      - name: Checkout content engine
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ONNELLAB_GITHUB_PAGES_TOKEN || github.token }}

      - name: Checkout homepage
        if: inputs.artwork_read_only != true
        uses: actions/checkout@v4
        with:
          repository: onnellab/onnellab.github.io
          path: ${{ env.HOMEPAGE_REPO_PATH }}
          token: ${{ secrets.ONNELLAB_GITHUB_PAGES_TOKEN || github.token }}

      - name: Refresh main before dashboard mutation
        if: inputs.artwork_read_only != true
        run: git pull --ff-only origin main

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install isolated artwork verifier runtime
        if: inputs.artwork_read_only == true || env.ARTWORK_CHECK_ONLY == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap

      - name: Sync GitHub main app versions and Flutter dependencies
        id: artwork_guard
        env:
          GITHUB_TOKEN: ${{ secrets.ONNELLAB_RELEASE_TOKEN || secrets.ONNELLAB_GITHUB_PAGES_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.artwork_read_only }}" = "true" ]; then
            python3 scripts/check_artwork_read_access.py
          else
            python3 scripts/sync_flutter_plugin_versions.py
            if [ "$ARTWORK_CHECK_ONLY" = "true" ]; then
              # All these commands only update the disposable local checkout.
              # No remote commit/push occurs unless reviewed artwork changes.
              python3 scripts/sync_android_versions_from_repos.py
              python3 scripts/check_store_versions.py
              python3 scripts/prepare_app_release_rows.py
              python3 scripts/fill_ready_app_releases.py
              python3 scripts/check_homepage_artwork_changes.py stage \
                --site "$HOMEPAGE_REPO_PATH" \
                --run-id "$GITHUB_RUN_ID" \
                --run-attempt "$GITHUB_RUN_ATTEMPT" \
                --work-dir "$RUNNER_TEMP/artwork-change-preflight" \
                --trigger data/artwork-change-trigger.json \
                --report "$RUNNER_TEMP/artwork-change-preflight.json" \
                --github-output "$GITHUB_OUTPUT"
            fi
          fi

      - name: Sync Android fallback versions from app repositories
        if: inputs.artwork_read_only != true && (env.ARTWORK_CHECK_ONLY != 'true' || steps.artwork_guard.outputs.changed == 'true')
        env:
          GITHUB_TOKEN: ${{ secrets.ONNELLAB_RELEASE_TOKEN || secrets.ONNELLAB_GITHUB_PAGES_TOKEN || github.token }}
        run: |
          set -euo pipefail
          python3 scripts/sync_android_versions_from_repos.py

      - name: Check public store versions
        if: inputs.artwork_read_only != true && (env.ARTWORK_CHECK_ONLY != 'true' || steps.artwork_guard.outputs.changed == 'true')
        run: |
          set -euo pipefail
          python3 scripts/check_store_versions.py

      - name: Sync homepage release notes
        if: inputs.artwork_read_only != true && (env.ARTWORK_CHECK_ONLY != 'true' || steps.artwork_guard.outputs.changed == 'true')
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_homepage_release_notes_sync
          python3 scripts/sync_homepage_release_notes.py --homepage-repo "$HOMEPAGE_REPO_PATH"

      - name: Prepare app release candidates
        if: inputs.artwork_read_only != true && (env.ARTWORK_CHECK_ONLY != 'true' || steps.artwork_guard.outputs.changed == 'true')
        run: |
          set -euo pipefail
          python3 scripts/prepare_app_release_rows.py

      - name: Sync GitHub release status
        if: inputs.artwork_read_only != true && (env.ARTWORK_CHECK_ONLY != 'true' || steps.artwork_guard.outputs.changed == 'true')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ONNELLAB_RELEASE_TOKEN: ${{ secrets.ONNELLAB_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/sync_github_release_status.py --allow-missing-token

      - name: Generate app release report
        if: inputs.artwork_read_only != true && (env.ARTWORK_CHECK_ONLY != 'true' || steps.artwork_guard.outputs.changed == 'true')
        run: |
          set -euo pipefail
          python3 scripts/generate_app_release_report.py

      - name: Build operational dashboard
        if: inputs.artwork_read_only != true && env.DEPLOY_DASHBOARD == 'true' && (env.ARTWORK_CHECK_ONLY != 'true' || steps.artwork_guard.outputs.changed == 'true')
        run: |
          set -euo pipefail
          python3 scripts/build_manual_publish_site.py \
            --homepage-repo "$HOMEPAGE_REPO_PATH" \
            --store-review-triage /tmp/store-review-triage.json

      - name: Commit operational status snapshot
        if: inputs.artwork_read_only != true && (env.ARTWORK_CHECK_ONLY != 'true' || steps.artwork_guard.outputs.changed == 'true')
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          if [ "$DEPLOY_DASHBOARD" = "true" ]; then
            python3 scripts/build_manual_publish_site.py --homepage-repo "$HOMEPAGE_REPO_PATH"
            python3 scripts/validate_manual_publish_site.py generated/manual-publish/index.html
          fi
          git diff --check
          git add \
            data/app_flutter_dependency_versions.csv \
            data/android_store_versions.csv \
            data/store_versions.csv \
            data/app_releases.csv \
            data/app_release_sync_status.json \
            generated/reports/app_flutter_dependency_versions.md \
            generated/reports/app_releases.md
          if [ "$ARTWORK_CHECK_ONLY" = "true" ]; then
            git add data/artwork-change-trigger.json
          fi
          if [ "$DEPLOY_DASHBOARD" = "true" ]; then
            echo "Dashboard plaintext artifacts stay out of git"
          fi
          if git diff --cached --quiet; then
            echo "No app operational status changes to commit"
          else
            git commit -m "Refresh app operational status"
            git push origin HEAD:main
          fi

      - name: Commit homepage release metadata and deploy dashboard
        if: inputs.artwork_read_only != true && (env.ARTWORK_CHECK_ONLY != 'true' || steps.artwork_guard.outputs.changed == 'true')
        run: |
          set -euo pipefail
          git -C "$HOMEPAGE_REPO_PATH" config user.name "github-actions[bot]"
          git -C "$HOMEPAGE_REPO_PATH" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$HOMEPAGE_REPO_PATH" pull --rebase --autostash origin main
          python3 scripts/sync_homepage_release_notes.py --homepage-repo "$HOMEPAGE_REPO_PATH"

          if [ "$DEPLOY_DASHBOARD" = "true" ]; then
            mkdir -p "$HOMEPAGE_REPO_PATH/public/ops"
            python3 scripts/validate_manual_publish_site.py generated/manual-publish/index.html
            node scripts/private_ops_publish.mjs seal-site generated/manual-publish "$HOMEPAGE_REPO_PATH/public/ops"
            python3 scripts/validate_manual_publish_site.py --sealed "$HOMEPAGE_REPO_PATH/public/ops/index.html"
          fi

          git -C "$HOMEPAGE_REPO_PATH" diff --check
          git -C "$HOMEPAGE_REPO_PATH" add src/data/store-release-notes.json
          if [ "$DEPLOY_DASHBOARD" = "true" ]; then
            git -C "$HOMEPAGE_REPO_PATH" add public/ops/
          fi
          if git -C "$HOMEPAGE_REPO_PATH" diff --cached --quiet; then
            echo "No homepage release metadata or dashboard changes to deploy"
          else
            git -C "$HOMEPAGE_REPO_PATH" commit -m "Refresh app release metadata"
            git -C "$HOMEPAGE_REPO_PATH" push origin HEAD:main
          fi

