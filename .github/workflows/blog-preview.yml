name: Preview nine-language blog candidate
on:
  push:
    branches: [main, verify/vaultxt-text-navigation-20261024, verify/tagweaver-caption-20261024, verify/segra-working-copy-20261028]
    paths:
      - '.github/workflows/blog-preview.yml'
      - 'preview/clipnest/**'
      - 'preview/aligna/**'
      - 'preview/research-source-notes/**'
      - 'preview/vaultxt-text-navigation/**'
      - 'preview/segra-working-copy/**'
      - 'scripts/prepare_segra_preview.py'
      - 'scripts/segra_preview_contract.py'
      - 'tests/test_segra_preview.py'
      - 'scripts/prepare_vaultxt_preview.py'
      - 'scripts/vaultxt_preview_contract.py'
      - 'scripts/prepare_tagweaver_preview.py'
      - 'preview/tagweaver-album-artists/**'
      - 'tests/test_tagweaver_preview.py'
      - 'tests/test_vaultxt_preview.py'
      - 'scripts/prepare_aligna_preview.py'
      - 'scripts/prepare_research_preview.py'
      - 'scripts/evaluate_article.py'
      - 'tests/test_aligna_preview.py'
      - 'tests/test_research_preview.py'
      - 'tests/test_preview_candidate_profiles.py'
      - 'tests/test_conversational_korean_definitions.py'
      - 'scripts/prepare_blog_preview.py'
      - 'tests/test_blog_preview.py'
      - 'tests/blog-preview.spec.ts'
  workflow_dispatch:
    inputs:
      candidate:
        description: Nonpublishing candidate
        type: choice
        default: research-source-notes
        options: [research-source-notes, vaultxt-text-navigation, tagweaver-album-artists, segra-working-copy]
permissions:
  contents: read
concurrency:
  group: blog-preview
  cancel-in-progress: true
jobs:
  preview:
    if: github.repository == 'onnellab/onnel-content-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEGRA_PREVIEW: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/verify/segra-working-copy-20261028') || inputs.candidate == 'segra-working-copy' }}
      VAULTXT_PREVIEW: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/verify/vaultxt-text-navigation-20261024') || inputs.candidate == 'vaultxt-text-navigation' }}
      TAGWEAVER_PREVIEW: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/verify/tagweaver-caption-20261024') || inputs.candidate == 'tagweaver-album-artists' }}
    steps:
      - name: Checkout preview source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout exact nonpublishing blog metadata validation revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: onnellab/onnellab.github.io
          ref: fd8f97cbb1af94bdb42f25be28aa88d322bc3ec1
          path: .preview-homepage
          persist-credentials: false
      - name: Configure existing Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - name: Validate overlay boundaries and source checksums
        run: |
          python3 -m unittest discover -s tests -p test_blog_preview.py -v
          python3 -m unittest discover -s tests -p test_preview_candidate_profiles.py -v
          python3 -m unittest discover -s tests -p test_conversational_korean_definitions.py -v
          python3 -m unittest discover -s tests -p test_aligna_preview.py -v
          python3 -m unittest discover -s tests -p test_research_preview.py -v
          python3 -m unittest discover -s tests -p test_vaultxt_preview.py -v
          python3 -m unittest discover -s tests -p test_segra_preview.py -v
          python3 -m unittest discover -s tests -p test_tagweaver_preview.py -v
          python3 -m unittest discover -s tests -p test_functional_field_definitions.py -v
          python3 scripts/prepare_blog_preview.py --bundle preview/clipnest/candidate.json --validate-only
      - name: Install existing publisher renderer dependencies
        timeout-minutes: 8
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y librsvg2-bin fonts-noto-cjk
      - name: Validate research source notes with actual native gates in a disposable engine copy
        if: env.VAULTXT_PREVIEW != 'true' && env.TAGWEAVER_PREVIEW != 'true' && env.SEGRA_PREVIEW != 'true'
        run: python3 scripts/prepare_research_preview.py
      - name: Validate VaultXT with actual native gates in a disposable engine copy
        if: env.VAULTXT_PREVIEW == 'true'
        run: python3 scripts/prepare_vaultxt_preview.py
      - name: Validate TagWeaver with actual native gates in a disposable engine copy
        if: env.TAGWEAVER_PREVIEW == 'true'
        run: python3 scripts/prepare_tagweaver_preview.py
      - name: Validate Segra with actual native gates in a disposable engine copy
        if: env.SEGRA_PREVIEW == 'true'
        run: python3 scripts/prepare_segra_preview.py
      - name: Verify tracked source remains unchanged
        run: git diff --exit-code
      - name: Audit locked homepage dependencies
        working-directory: .preview-homepage
        run: npm audit --package-lock-only --include=dev --audit-level=high
      - name: Install locked homepage dependencies
        working-directory: .preview-homepage
        run: npm ci
      - name: Verify summary content preservation and existing Astro template contracts
        working-directory: .preview-homepage
        run: |
          node --test scripts/blog-summary-blocks-contract.mjs
          npm run test:blog-template
          npm run check:i18n-quality
      - name: Overlay candidate only in disposable checkout
        run: |
          if [ "$SEGRA_PREVIEW" = "true" ]; then
            python3 scripts/prepare_blog_preview.py --bundle preview-evidence/segra-working-copy/candidate.json --homepage .preview-homepage --evidence preview-evidence
          elif [ "$VAULTXT_PREVIEW" = "true" ]; then
            python3 scripts/prepare_blog_preview.py --bundle preview-evidence/vaultxt-text-navigation/candidate.json --homepage .preview-homepage --evidence preview-evidence
          elif [ "$TAGWEAVER_PREVIEW" = "true" ]; then
            python3 scripts/prepare_blog_preview.py --bundle preview-evidence/tagweaver-album-artists/candidate.json --homepage .preview-homepage --evidence preview-evidence
          else
            python3 scripts/prepare_blog_preview.py --bundle preview-evidence/research-source-notes/candidate.json --homepage .preview-homepage --evidence preview-evidence
          fi
          test ! -e .preview-homepage/tests/blog-preview.spec.ts
          test ! -L .preview-homepage/tests/blog-preview.spec.ts
          cp tests/blog-preview.spec.ts .preview-homepage/tests/blog-preview.spec.ts
      - name: Build pinned Astro templates and styles
        working-directory: .preview-homepage
        run: npm run build
      - name: Install existing homepage test browser
        working-directory: .preview-homepage
        run: npx playwright install --with-deps chromium
      - name: Check desktop and mobile and capture every page
        working-directory: .preview-homepage
        run: npx playwright test tests/blog-preview.spec.ts tests/blog-header-responsive.spec.ts --project=desktop --project=mobile --workers=1 --reporter=line,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ../preview-evidence/playwright-results.json
      - name: Retain bounded preview evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blog-preview-${{ github.sha }}
          path: |
            preview-evidence
            .preview-homepage/preview-screenshots
            .preview-homepage/test-results
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

