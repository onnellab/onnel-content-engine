name: Sync Store Reviews

on:
  workflow_dispatch:
    inputs:
      deploy_dashboard:
        description: "Build, deploy, and verify /ops/ after syncing reviews"
        required: false
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - "scripts/sync_store_reviews.py"
      - "scripts/sync_store_pricing.py"
      - "scripts/verify_live_ops.py"
      - "scripts/build_manual_publish_site.py"
      - "data/app_pricing.csv"
      - "scripts/youtube_dashboard_panel.py"
      - "scripts/suno_api_connect.py"
      - "scripts/suno_api_credentials.py"
      - "scripts/install_youtube_connect.py"
      - "templates/suno_api_connect.html"

concurrency:
  group: onnellab-manual-dashboard-writer
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HOMEPAGE_REPO_PATH: .homepage
      DEPLOY_DASHBOARD: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_dashboard }}

    steps:
      - name: Checkout content engine
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ONNELLAB_GITHUB_PAGES_TOKEN || github.token }}

      - name: Checkout homepage
        if: env.DEPLOY_DASHBOARD == 'true'
        uses: actions/checkout@v4
        with:
          repository: onnellab/onnellab.github.io
          path: ${{ env.HOMEPAGE_REPO_PATH }}
          token: ${{ secrets.ONNELLAB_GITHUB_PAGES_TOKEN || github.token }}

      - name: Refresh main before dashboard mutation
        run: git pull --ff-only origin main

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Synchronize reviews
        env:
          APP_STORE_CONNECT_READ_KEY_TYPE: ${{ secrets.APP_STORE_CONNECT_READ_KEY_TYPE }}
          APP_STORE_CONNECT_READ_KEY_ID: ${{ secrets.APP_STORE_CONNECT_READ_KEY_ID }}
          APP_STORE_CONNECT_READ_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_READ_ISSUER_ID }}
          APP_STORE_CONNECT_READ_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_READ_PRIVATE_KEY_BASE64 }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_TOKEN: ${{ secrets.APP_STORE_CONNECT_TOKEN }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ secrets.GOOGLE_PLAY_ACCESS_TOKEN }}
          GOOGLE_PLAY_REPORTS_BUCKET: ${{ secrets.GOOGLE_PLAY_REPORTS_BUCKET }}
        run: |
          set -euo pipefail
          required=(
            GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64
            GOOGLE_PLAY_REPORTS_BUCKET
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
          python3 -c "import sys; sys.path.insert(0, 'scripts'); from sync_store_reviews import app_store_connect_read_token_from_env; assert app_store_connect_read_token_from_env(), 'App Store Connect read credentials are required'"
          python3 -m unittest discover -s tests -p 'test_store_review*.py'
          python3 -m unittest tests.test_store_pricing_sync tests.test_store_pricing_dashboard
          python3 scripts/sync_store_reviews.py
          python3 scripts/sync_store_pricing.py
          python3 scripts/triage_store_reviews.py
          python3 scripts/generate_ai_review_drafts.py

      - name: Verify provider setup and optionally build dashboard
        run: |
          python3 -m unittest discover -s tests -p 'test_short_video_connect.py'
          python3 -m unittest discover -s tests -p 'test_lyria.py'
          if [ "$DEPLOY_DASHBOARD" = "true" ]; then
            python3 scripts/build_manual_publish_site.py --homepage-repo "$HOMEPAGE_REPO_PATH"
          fi

      - name: Commit review snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$DEPLOY_DASHBOARD" = "true" ]; then
            python3 scripts/build_manual_publish_site.py --homepage-repo "$HOMEPAGE_REPO_PATH"
            python3 scripts/validate_manual_publish_site.py generated/manual-publish/index.html
          fi
          git diff --check
          git add data/store_reviews.csv data/store_reviews_archive.json data/store_review_sync_status.json data/store_review_triage.json data/store_pricing_snapshot.json generated/review-replies/review_packet.json generated/review-replies/review_packet.md
          if [ "$DEPLOY_DASHBOARD" = "true" ]; then
            git add generated/manual-publish/
          fi
          if git diff --cached --quiet; then
            echo "No store review changes to commit"
          else
            git commit -m "Sync store reviews"
            git pull --rebase origin main
            if [ "$DEPLOY_DASHBOARD" = "true" ]; then
              python3 scripts/build_manual_publish_site.py --homepage-repo "$HOMEPAGE_REPO_PATH"
              python3 scripts/validate_manual_publish_site.py generated/manual-publish/index.html
              git add data/store_review_triage.json generated/manual-publish/
              if ! git diff --cached --quiet; then
                git commit -m "Rebuild review dashboard after source synchronization"
              fi
            fi
            git push origin HEAD:main
          fi

      - name: Deploy dashboard
        if: env.DEPLOY_DASHBOARD == 'true'
        run: |
          set -euo pipefail
          git -C "$HOMEPAGE_REPO_PATH" pull --rebase origin main
          mkdir -p "$HOMEPAGE_REPO_PATH/public/ops"
          python3 scripts/validate_manual_publish_site.py generated/manual-publish/index.html
          cp generated/manual-publish/index.html "$HOMEPAGE_REPO_PATH/public/ops/index.html"
          for section in apps publishing media settings legacy; do
            mkdir -p "$HOMEPAGE_REPO_PATH/public/ops/$section"
            cp -R "generated/manual-publish/$section/." "$HOMEPAGE_REPO_PATH/public/ops/$section/"
          done
          cp generated/manual-publish/manifest.webmanifest "$HOMEPAGE_REPO_PATH/public/ops/manifest.webmanifest"
          cp generated/manual-publish/sw.js "$HOMEPAGE_REPO_PATH/public/ops/sw.js"
          cp generated/manual-publish/icon-180.png "$HOMEPAGE_REPO_PATH/public/ops/icon-180.png"
          cp generated/manual-publish/icon-192.png "$HOMEPAGE_REPO_PATH/public/ops/icon-192.png"
          cp generated/manual-publish/icon-512.png "$HOMEPAGE_REPO_PATH/public/ops/icon-512.png"
          cp generated/manual-publish/libsodium-sumo.js "$HOMEPAGE_REPO_PATH/public/ops/libsodium-sumo.js"
          cp generated/manual-publish/libsodium-wrappers.js "$HOMEPAGE_REPO_PATH/public/ops/libsodium-wrappers.js"
          git -C "$HOMEPAGE_REPO_PATH" config user.name "github-actions[bot]"
          git -C "$HOMEPAGE_REPO_PATH" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp generated/manual-publish/index.html "$HOMEPAGE_REPO_PATH/public/ops/index.html"
          for section in apps publishing media settings legacy; do
            mkdir -p "$HOMEPAGE_REPO_PATH/public/ops/$section"
            cp -R "generated/manual-publish/$section/." "$HOMEPAGE_REPO_PATH/public/ops/$section/"
          done
          python3 scripts/validate_manual_publish_site.py "$HOMEPAGE_REPO_PATH/public/ops/index.html"
          git -C "$HOMEPAGE_REPO_PATH" diff --check
          git -C "$HOMEPAGE_REPO_PATH" add public/ops/
          if git -C "$HOMEPAGE_REPO_PATH" diff --cached --quiet; then
            echo "No dashboard changes to deploy"
          else
            git -C "$HOMEPAGE_REPO_PATH" commit -m "Refresh store review dashboard"
            git -C "$HOMEPAGE_REPO_PATH" push origin HEAD:main
          fi

      - name: Verify live ops deployment
        if: env.DEPLOY_DASHBOARD == 'true'
        id: live_ops
        continue-on-error: true
        run: |
          python3 scripts/verify_live_ops.py \
            --expected generated/manual-publish/index.html \
            --output data/ops_live_verification.json

      - name: Commit live ops verification
        if: env.DEPLOY_DASHBOARD == 'true' && always()
        run: |
          set -euo pipefail
          if [ ! -f data/ops_live_verification.json ]; then
            echo "No live ops verification record was produced"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ops_live_verification.json
          if ! git diff --cached --quiet; then
            git commit -m "Record live ops verification"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enforce live ops verification
        if: env.DEPLOY_DASHBOARD == 'true' && steps.live_ops.outcome != 'success'
        run: exit 1
