# Verify owned-brand export and reviewed multilingual diagrams without a privacy deployment.
# Validate the verified Papira source facts without unrelated deployment triggers.
# Validate the nine-language engine after the isolated blog-only integration push.
name: Offline Python Unit Tests
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'templates/**'
      - 'generated/markdown/**'
      - 'data/apps_registry.csv'
      - 'data/store_versions.csv'
      - 'data/topics.csv'
      - 'requirements-test.txt'
      - 'requirements-short-video.txt'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'templates/**'
      - 'generated/markdown/**'
      - 'data/apps_registry.csv'
      - 'data/store_versions.csv'
      - 'data/topics.csv'
      - 'requirements-test.txt'
      - 'requirements-short-video.txt'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install SVG renderer on Linux
        if: runner.os == 'Linux'
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y librsvg2-bin fonts-noto-cjk
      - name: Install SVG renderer on macOS
        if: runner.os == 'macOS'
        run: brew install librsvg
      - name: Check renderer availability
        run: rsvg-convert --version
      - name: Install declared test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run complete suite without live network calls
        run: python scripts/run_unit_tests.py
      # Closed registration gate only; never require published bundles to stay in review.
      - name: Validate both registered blog bundles in a disposable copy
        if: github.event_name == 'pull_request' && github.head_ref == 'verify/blog-review-integration-20261024'
        run: python scripts/validate_blog_review_integration.py
      - name: Checkout exact pre-fallback renderer for visual comparison
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c44880130edd0a0a5d07afec1a2565df120b2964
          path: .comparison-old
          persist-credentials: false
      - name: Render bounded nine-language social card comparison
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python scripts/render_social_card_regression.py
      - name: Retain public social card comparison images
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: social-card-regression-${{ github.sha }}
          path: card-regression-evidence
          if-no-files-found: error
          retention-days: 1
      - name: Ensure tests did not mutate tracked operational state
        run: git diff --exit-code
