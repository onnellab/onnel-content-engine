name: ONNELLAB Publish Ready App Releases

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync app operational status"]
    types: [completed]

concurrency:
  group: onnellab-manual-dashboard-writer
  cancel-in-progress: false

env:
  ONNELLAB_OPS_PASSWORD: ${{ secrets.ONNELLAB_OPS_PASSWORD }}

jobs:
  publish-ready-app-releases:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.display_title != 'Read-only artwork access probe')
    name: Publish public-store-confirmed release notes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      HOMEPAGE_REPO_PATH: .homepage

    steps:
      - name: Checkout content engine
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ONNELLAB_GITHUB_PAGES_TOKEN || github.token }}

      - name: Refresh main before dashboard mutation
        run: git pull --ff-only origin main

      - name: Gate automatic artwork checks by their exact changed run
        id: artwork_run
        env:
          SOURCE_RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          if [ "$SOURCE_RUN_TITLE" = "Check reviewed artwork changes" ]; then
            python3 scripts/check_homepage_artwork_changes.py authorize \
              --trigger data/artwork-change-trigger.json \
              --source-run-id "$SOURCE_RUN_ID" \
              --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
              --github-output "$GITHUB_OUTPUT"
          else
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout homepage
        if: steps.artwork_run.outputs.authorized == 'true'
        uses: actions/checkout@v4
        with:
          repository: onnellab/onnellab.github.io
          path: ${{ env.HOMEPAGE_REPO_PATH }}
          token: ${{ secrets.ONNELLAB_GITHUB_PAGES_TOKEN || github.token }}

      - name: Configure Python
        if: steps.artwork_run.outputs.authorized == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install isolated artwork verifier runtime
        if: steps.artwork_run.outputs.authorized == 'true'
        run: |
          set -euo pipefail
          # Do not disable Ubuntu's unprivileged-userns AppArmor restriction.
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = "1"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap apparmor apparmor-profiles
          # Ubuntu's packaged *restrictive* bwrap profile permits namespace
          # setup by bwrap but forbids further user namespaces in the child.
          # A missing/unloadable profile blocks publication (no bypass).
          test -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = "1"
          python3 -c 'from scripts.isolated_vendored_artwork import sandbox_preflight; sandbox_preflight()'

      - name: Prepare automatic release readiness from confirmed public store versions
        if: steps.artwork_run.outputs.authorized == 'true'
        run: |
          set -euo pipefail
          python3 scripts/fill_ready_app_releases.py
          python3 scripts/validate_app_releases.py

      - name: Configure Node
        if: steps.artwork_run.outputs.authorized == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify artwork publication contracts
        if: steps.artwork_run.outputs.authorized == 'true'
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_homepage_release_artwork.py'
          node --test "$HOMEPAGE_REPO_PATH/scripts/screenshot-versions-contract.mjs"

      - name: Install Playwright
        if: steps.artwork_run.outputs.authorized == 'true'
        run: |
          set -euo pipefail
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Create public GitHub Releases
        if: steps.artwork_run.outputs.authorized == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ONNELLAB_RELEASE_TOKEN: ${{ secrets.ONNELLAB_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/create_github_releases.py --publish

      - name: Sync GitHub release status
        if: steps.artwork_run.outputs.authorized == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ONNELLAB_RELEASE_TOKEN: ${{ secrets.ONNELLAB_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/sync_github_release_status.py --allow-missing-token

      - name: Generate dashboard snapshots
        if: steps.artwork_run.outputs.authorized == 'true'
        run: |
          set -euo pipefail
          python3 scripts/sync_ai_provider_pricing.py
          python3 scripts/generate_app_release_report.py
          python3 scripts/build_manual_publish_site.py --homepage-repo "$HOMEPAGE_REPO_PATH"

      - name: Stage independently reviewed public-release app detail artwork
        if: steps.artwork_run.outputs.authorized == 'true'
        env:
          ONNELLAB_RELEASE_TOKEN: ${{ secrets.ONNELLAB_RELEASE_TOKEN || secrets.ONNELLAB_GITHUB_PAGES_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/sync_homepage_release_artwork.py stage \
            --homepage-repo "$HOMEPAGE_REPO_PATH" \
            --work-dir "$RUNNER_TEMP/release-artwork-apps" \
            --report "$RUNNER_TEMP/artwork-staging.json"

      - name: Commit content engine release state
        if: steps.artwork_run.outputs.authorized == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/validate_manual_publish_site.py generated/manual-publish/index.html
          git diff --check
          git add data/app_releases.csv data/app_release_sync_status.json data/ai_provider_pricing.csv data/ai_provider_pricing_status.json data/melivra_ai_credit_policy.csv data/store_review_triage.json generated/reports/app_releases.md
          if ! git diff --quiet; then
            echo "Unexpected unstaged changes remain after staging release outputs:" >&2
            git status --short >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No content engine release state changes"
          else
            git commit -m "Update app release publication state"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Deploy dashboard and verified app detail artwork
        if: steps.artwork_run.outputs.authorized == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOMEPAGE_REPO_PATH/public/ops"
          python3 scripts/validate_manual_publish_site.py generated/manual-publish/index.html
          node scripts/private_ops_publish.mjs seal-site generated/manual-publish "$HOMEPAGE_REPO_PATH/public/ops"
          git -C "$HOMEPAGE_REPO_PATH" config user.name "github-actions[bot]"
          git -C "$HOMEPAGE_REPO_PATH" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/validate_manual_publish_site.py --sealed "$HOMEPAGE_REPO_PATH/public/ops/index.html"
          git -C "$HOMEPAGE_REPO_PATH" diff --check
          git -C "$HOMEPAGE_REPO_PATH" add public/ops/
          python3 scripts/sync_homepage_release_artwork.py stage-git \
            --homepage-repo "$HOMEPAGE_REPO_PATH" \
            --report "$RUNNER_TEMP/artwork-staging.json"
          if git -C "$HOMEPAGE_REPO_PATH" diff --cached --quiet; then
            echo "No dashboard or verified artwork changes"
          else
            git -C "$HOMEPAGE_REPO_PATH" commit -m "Refresh app release dashboard and verified detail artwork"
            git -C "$HOMEPAGE_REPO_PATH" pull --rebase origin main
            git -C "$HOMEPAGE_REPO_PATH" push origin HEAD:main
          fi

      - name: Verify deployed app detail images or retain evidence blockers
        if: steps.artwork_run.outputs.authorized == 'true'
        env:
          # Daily operational syncs do not fail solely because NO app has a
          # reviewed candidate. Explicit artwork-change runs and manual
          # dispatches remain strict; a staged-but-unverified app always fails.
          ARTWORK_REPORT_BLOCKED_ONLY: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.display_title != 'Check reviewed artwork changes' }}
        run: |
          set -euo pipefail
          report_only=()
          if [ "$ARTWORK_REPORT_BLOCKED_ONLY" = "true" ]; then
            report_only=(--report-blocked-no-candidates)
          fi
          python3 scripts/verify_homepage_release_artwork.py \
            --staging-report "$RUNNER_TEMP/artwork-staging.json" \
            --output "$RUNNER_TEMP/artwork-deployment-receipt.json" \
            --deployment-sha "$(git -C "$HOMEPAGE_REPO_PATH" rev-parse HEAD)" \
            "${report_only[@]}"

      - name: Retain artwork staging and public verification evidence
        if: always() && steps.artwork_run.outputs.authorized == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-artwork-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/artwork-staging.json
            ${{ runner.temp }}/artwork-deployment-receipt.json
          if-no-files-found: warn
          retention-days: 30
