name: ONNELLAB Publish Ready App Releases

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync app operational status"]
    types: [completed]

concurrency:
  group: onnellab-manual-dashboard-writer
  cancel-in-progress: false

jobs:
  publish-ready-app-releases:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Publish public-store-confirmed release notes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HOMEPAGE_REPO_PATH: .homepage

    steps:
      - name: Checkout content engine
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ONNELLAB_GITHUB_PAGES_TOKEN || github.token }}

      - name: Checkout homepage
        uses: actions/checkout@v4
        with:
          repository: onnellab/onnellab.github.io
          path: ${{ env.HOMEPAGE_REPO_PATH }}
          token: ${{ secrets.ONNELLAB_GITHUB_PAGES_TOKEN || github.token }}

      - name: Refresh main before dashboard mutation
        run: git pull --ff-only origin main

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Prepare automatic release readiness from confirmed public store versions
        run: |
          set -euo pipefail
          python3 scripts/fill_ready_app_releases.py
          python3 scripts/validate_app_releases.py

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          set -euo pipefail
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Create public GitHub Releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ONNELLAB_RELEASE_TOKEN: ${{ secrets.ONNELLAB_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/create_github_releases.py --publish

      - name: Sync GitHub release status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ONNELLAB_RELEASE_TOKEN: ${{ secrets.ONNELLAB_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/sync_github_release_status.py --allow-missing-token

      - name: Generate dashboard snapshots
        run: |
          set -euo pipefail
          python3 scripts/sync_ai_provider_pricing.py
          python3 scripts/generate_app_release_report.py
          python3 scripts/build_manual_publish_site.py --homepage-repo "$HOMEPAGE_REPO_PATH"

      - name: Commit content engine release state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/validate_manual_publish_site.py generated/manual-publish/index.html
          git diff --check
          git add data/app_releases.csv data/app_release_sync_status.json data/ai_provider_pricing.csv data/ai_provider_pricing_status.json data/melivra_ai_credit_policy.csv data/store_review_triage.json generated/reports/app_releases.md generated/manual-publish/
          if ! git diff --quiet; then
            echo "Unexpected unstaged changes remain after staging release outputs:" >&2
            git status --short >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No content engine release state changes"
          else
            git commit -m "Update app release publication state"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Deploy manual publish dashboard
        run: |
          set -euo pipefail
          mkdir -p "$HOMEPAGE_REPO_PATH/public/ops"
          python3 scripts/validate_manual_publish_site.py generated/manual-publish/index.html
          cp generated/manual-publish/index.html "$HOMEPAGE_REPO_PATH/public/ops/index.html"
          for section in apps publishing media settings legacy; do
            mkdir -p "$HOMEPAGE_REPO_PATH/public/ops/$section"
            cp -R "generated/manual-publish/$section/." "$HOMEPAGE_REPO_PATH/public/ops/$section/"
          done
          cp generated/manual-publish/manifest.webmanifest "$HOMEPAGE_REPO_PATH/public/ops/manifest.webmanifest"
          cp generated/manual-publish/sw.js "$HOMEPAGE_REPO_PATH/public/ops/sw.js"
          cp generated/manual-publish/icon-180.png "$HOMEPAGE_REPO_PATH/public/ops/icon-180.png"
          cp generated/manual-publish/icon-192.png "$HOMEPAGE_REPO_PATH/public/ops/icon-192.png"
          cp generated/manual-publish/icon-512.png "$HOMEPAGE_REPO_PATH/public/ops/icon-512.png"
          cp generated/manual-publish/libsodium-sumo.js "$HOMEPAGE_REPO_PATH/public/ops/libsodium-sumo.js"
          cp generated/manual-publish/libsodium-wrappers.js "$HOMEPAGE_REPO_PATH/public/ops/libsodium-wrappers.js"
          git -C "$HOMEPAGE_REPO_PATH" config user.name "github-actions[bot]"
          git -C "$HOMEPAGE_REPO_PATH" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/validate_manual_publish_site.py "$HOMEPAGE_REPO_PATH/public/ops/index.html"
          git -C "$HOMEPAGE_REPO_PATH" diff --check
          git -C "$HOMEPAGE_REPO_PATH" add public/ops/
          if git -C "$HOMEPAGE_REPO_PATH" diff --cached --quiet; then
            echo "No manual publish dashboard changes"
          else
            git -C "$HOMEPAGE_REPO_PATH" commit -m "Refresh app release dashboard"
            git -C "$HOMEPAGE_REPO_PATH" pull --rebase origin main
            git -C "$HOMEPAGE_REPO_PATH" push origin HEAD:main
          fi
