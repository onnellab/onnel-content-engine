name: Generate AI Manager Report
on:
  schedule: [{cron: '40 0 * * *'}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python3 scripts/generate_ai_manager_report.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/ai_manager_daily_report.json
          git diff --cached --quiet || git commit -m "Generate AI manager report"
          git push
