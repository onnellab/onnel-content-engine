name: Generate AI Manager Report
on:
  schedule: [{cron: '40 0 * * *'}]
  workflow_dispatch:
permissions: {contents: write, issues: write}
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Collect configured Sentry crashes
        run: python3 scripts/collect_sentry_crashes.py
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: Collect configured Crashlytics issues
        run: python3 scripts/collect_crashlytics_incidents.py
        env:
          FIREBASE_CRASHLYTICS_ACCESS_TOKEN: ${{ secrets.FIREBASE_CRASHLYTICS_ACCESS_TOKEN }}
      - name: Run AI-Doctor correlation
        run: python3 scripts/analyze_incidents.py
      - name: Analyze internal tester feedback
        run: python3 scripts/analyze_internal_test_feedback.py
      - name: Prepare AI-Coder tasks
        run: python3 scripts/generate_ai_coder_tasks.py
      - name: Assess OS update impact
        run: python3 scripts/analyze_os_update_impact.py
      - name: Generate manager report
        run: python3 scripts/generate_ai_manager_report.py
      - name: Update optional GitHub manager notification
        run: python3 scripts/publish_ai_manager_issue.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Send optional manager webhook
        run: python3 scripts/publish_ai_manager_webhook.py
        env:
          OPS_MANAGER_WEBHOOK_URL: ${{ secrets.OPS_MANAGER_WEBHOOK_URL }}
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/crash_incidents.csv data/crash_sync_status.json data/crashlytics_sync_status.json data/ai_doctor_findings.json data/internal_test_findings.json data/ai_coder_tasks.json data/os_update_impact_tasks.json data/ai_manager_daily_report.json
          git diff --cached --quiet || git commit -m "Generate AI manager report"
          git push
