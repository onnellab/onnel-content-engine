name: Sync Store Funnel

on:
  workflow_dispatch:
  schedule:
    - cron: "37 0 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/sync_store_funnel.py"
      - "tests/test_store_funnel_sync.py"
      - ".github/workflows/sync-store-funnel.yml"

concurrency:
  group: onnellab-manual-dashboard-writer
  cancel-in-progress: false

env:
  ONNELLAB_OPS_PASSWORD: ${{ secrets.ONNELLAB_OPS_PASSWORD }}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HOMEPAGE_REPO_PATH: .homepage

    steps:
      - name: Checkout content engine
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ONNELLAB_GITHUB_PAGES_TOKEN || github.token }}

      - name: Checkout homepage
        uses: actions/checkout@v4
        with:
          repository: onnellab/onnellab.github.io
          path: ${{ env.HOMEPAGE_REPO_PATH }}
          token: ${{ secrets.ONNELLAB_GITHUB_PAGES_TOKEN || github.token }}

      - name: Refresh main before dashboard mutation
        run: git pull --ff-only origin main

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify funnel collector
        run: python3 -m unittest tests.test_store_funnel_sync

      - name: Synchronize store funnel
        env:
          APP_STORE_CONNECT_READ_KEY_TYPE: ${{ secrets.APP_STORE_CONNECT_READ_KEY_TYPE }}
          APP_STORE_CONNECT_READ_KEY_ID: ${{ secrets.APP_STORE_CONNECT_READ_KEY_ID }}
          APP_STORE_CONNECT_READ_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_READ_ISSUER_ID }}
          APP_STORE_CONNECT_READ_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_READ_PRIVATE_KEY_BASE64 }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_TOKEN: ${{ secrets.APP_STORE_CONNECT_TOKEN }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ secrets.GOOGLE_PLAY_ACCESS_TOKEN }}
          GOOGLE_PLAY_REPORTS_BUCKET: ${{ secrets.GOOGLE_PLAY_REPORTS_BUCKET }}
        run: |
          set -euo pipefail
          python3 scripts/sync_store_funnel.py
          python3 scripts/build_manual_publish_site.py --homepage-repo "$HOMEPAGE_REPO_PATH" --store-review-triage /tmp/store-review-triage.json
          python3 scripts/validate_manual_publish_site.py generated/manual-publish/index.html

      - name: Commit funnel snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add             data/store_funnel_daily.csv             data/store_funnel.json             data/store_funnel_sync_status.json             data/store_funnel_state.json
          if git diff --cached --quiet; then
            echo "No store funnel changes to commit"
          else
            git commit -m "Sync store acquisition funnel"
            git pull --rebase origin main
            python3 scripts/build_manual_publish_site.py --homepage-repo "$HOMEPAGE_REPO_PATH" --store-review-triage /tmp/store-review-triage.json
            python3 scripts/validate_manual_publish_site.py generated/manual-publish/index.html
            echo "Dashboard plaintext artifacts stay out of git"
            if ! git diff --cached --quiet; then
              git commit -m "Rebuild funnel dashboard after source synchronization"
            fi
            git push origin HEAD:main
          fi

      - name: Deploy dashboard
        run: |
          set -euo pipefail
          git -C "$HOMEPAGE_REPO_PATH" pull --rebase origin main
          mkdir -p "$HOMEPAGE_REPO_PATH/public/ops"
          python3 scripts/validate_manual_publish_site.py generated/manual-publish/index.html
          node scripts/private_ops_publish.mjs seal-site generated/manual-publish "$HOMEPAGE_REPO_PATH/public/ops"
          python3 scripts/validate_manual_publish_site.py --sealed "$HOMEPAGE_REPO_PATH/public/ops/index.html"
          git -C "$HOMEPAGE_REPO_PATH" diff --check
          git -C "$HOMEPAGE_REPO_PATH" config user.name "github-actions[bot]"
          git -C "$HOMEPAGE_REPO_PATH" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$HOMEPAGE_REPO_PATH" add public/ops/
          if git -C "$HOMEPAGE_REPO_PATH" diff --cached --quiet; then
            echo "No dashboard changes to deploy"
          else
            git -C "$HOMEPAGE_REPO_PATH" commit -m "Refresh store funnel dashboard"
            git -C "$HOMEPAGE_REPO_PATH" push origin HEAD:main
          fi

      - name: Verify live ops deployment
        run: |
          python3 scripts/verify_live_ops.py             --expected "$HOMEPAGE_REPO_PATH/public/ops/index.html"             --output data/ops_live_verification.json
