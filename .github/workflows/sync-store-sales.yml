name: Sync Private Store Sales

on:
  workflow_dispatch:
  schedule:
    - cron: "12 2 * * *"

permissions:
  contents: write

concurrency:
  group: onnellab-manual-dashboard-writer
  cancel-in-progress: false

jobs:
  sales:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HOMEPAGE_REPO_PATH: .homepage
      ONNELLAB_OPS_PASSWORD: ${{ secrets.ONNELLAB_OPS_PASSWORD }}
    steps:
      - name: Checkout content engine
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ONNELLAB_GITHUB_PAGES_TOKEN }}

      - name: Checkout homepage
        uses: actions/checkout@v4
        with:
          repository: onnellab/onnellab.github.io
          path: .homepage
          token: ${{ secrets.ONNELLAB_GITHUB_PAGES_TOKEN }}

      - name: Refresh main before finance mutation
        run: git pull --ff-only origin main

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify sales collector
        run: python3 -m unittest tests.test_store_sales_ledger tests.test_store_fx_rates tests.test_private_ops_publish tests.test_ops_sales_page

      - name: Collect and encrypt private finance data
        env:
          APP_STORE_VENDOR_NUMBER: ${{ secrets.APP_STORE_VENDOR_NUMBER }}
          APP_STORE_FINANCE_KEY_ID: ${{ secrets.APP_STORE_FINANCE_KEY_ID }}
          APP_STORE_FINANCE_ISSUER_ID: ${{ secrets.APP_STORE_FINANCE_ISSUER_ID }}
          APP_STORE_FINANCE_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_FINANCE_PRIVATE_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          APP_STORE_CONNECT_READ_KEY_TYPE: ${{ secrets.APP_STORE_CONNECT_READ_KEY_TYPE }}
          APP_STORE_CONNECT_READ_KEY_ID: ${{ secrets.APP_STORE_CONNECT_READ_KEY_ID }}
          APP_STORE_CONNECT_READ_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_READ_ISSUER_ID }}
          APP_STORE_CONNECT_READ_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_READ_PRIVATE_KEY_BASE64 }}
          GOOGLE_PLAY_REPORTS_BUCKET: ${{ secrets.GOOGLE_PLAY_REPORTS_BUCKET }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -f data/private_store_sales.enc.json ]; then
            node scripts/private_ops_publish.mjs unseal-data data/private_store_sales.enc.json "$RUNNER_TEMP/onnel-previous.json"
            python3 scripts/store_sales_ledger.py --output "$RUNNER_TEMP/onnel-sales.json" --earliest 2026-01-01 --previous "$RUNNER_TEMP/onnel-previous.json"
          else
            python3 scripts/store_sales_ledger.py --output "$RUNNER_TEMP/onnel-sales.json" --earliest 2026-01-01
          fi
          python3 scripts/store_fx_rates.py --ledger "$RUNNER_TEMP/onnel-sales.json" --previous "$RUNNER_TEMP/onnel-previous.json"
          node scripts/private_ops_publish.mjs seal-data "$RUNNER_TEMP/onnel-sales.json" data/private_store_sales.enc.json
          python3 -m json.tool data/private_store_sales.enc.json > /dev/null
          if grep -q '"rows"' data/private_store_sales.enc.json; then
            echo "::error::Plaintext sales rows detected in encrypted output"; exit 1
          fi
          # Report collection health without printing money, purchasers or keys.
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          record = json.loads((Path(os.environ["RUNNER_TEMP"]) / "onnel-sales.json").read_text())
          for platform, prefix in (("apple", "ios"), ("google", "android")):
              status = record["source_status"].get(platform, {})
              selected = {
                  field: status.get(field)
                  for field in ("status", "days_checked", "days_missing", "new_reports",
                                "sales_files", "earnings_files", "earnings_objects_listed",
                                "earnings_unrecognized_files", "missing_earnings_months",
                                "fee_source_status", "errors")
                  if field in status
              }
              count = sum(1 for row in record["rows"] if row["platform"] == prefix)
              print("FINANCE_REPORT_HEALTH_" + platform.upper() + "=" + json.dumps(selected, sort_keys=True))
              print("FINANCE_REPORT_ROW_GROUPS_" + platform.upper() + "=" + str(count))
          finance = record["source_status"].get("apple_finance", {})
          permitted = ("status", "reports_available", "reports_missing", "new_reports",
                       "rows_with_quantity", "matched_app_rows", "unmatched_app_rows", "errors")
          print("APPLE_MONTHLY_FINANCE_HEALTH=" + json.dumps({
              key:finance.get(key) for key in permitted if key in finance
          }, sort_keys=True))
          print("APPLE_MONTHLY_SETTLEMENT_ROWS=" + str(len(record.get("settlements", []))))
          apple = record["source_status"].get("apple", {})
          if any("HTTP 401" in error for error in apple.get("errors", [])):
              # Probe a harmless metadata endpoint with the same TEAM token.
              # Print only the HTTP status; do not disclose tokens or app metadata.
              import sys
              import urllib.error
              import urllib.request
              sys.path.insert(0, "scripts")
              from store_sales_ledger import apple_sales_token
              probe = urllib.request.Request(
                  "https://api.appstoreconnect.apple.com/v1/apps?limit=1",
                  headers={"Authorization": "Bearer " + apple_sales_token()},
              )
              try:
                  with urllib.request.urlopen(probe, timeout=15) as response:
                      print("APPLE_TEAM_TOKEN_APPS_PROBE_HTTP=" + str(response.status))
              except urllib.error.HTTPError as error:
                  print("APPLE_TEAM_TOKEN_APPS_PROBE_HTTP=" + str(error.code))
          PY

      - name: Commit ciphertext only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add data/private_store_sales.enc.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Sync encrypted store sales ledger"
            git push origin HEAD:main
          fi

      - name: Build and publish sealed dashboard
        run: |
          set -euo pipefail
          python3 scripts/build_manual_publish_site.py --homepage-repo "$HOMEPAGE_REPO_PATH" --store-review-triage /tmp/store-review-triage.json
          python3 scripts/validate_manual_publish_site.py generated/manual-publish/index.html
          git -C "$HOMEPAGE_REPO_PATH" pull --rebase origin main
          node scripts/private_ops_publish.mjs seal-site generated/manual-publish "$HOMEPAGE_REPO_PATH/public/ops"
          python3 scripts/validate_manual_publish_site.py --sealed "$HOMEPAGE_REPO_PATH/public/ops/index.html"
          python3 scripts/validate_manual_publish_site.py --sealed "$HOMEPAGE_REPO_PATH/public/ops/sales/index.html"
          if grep -R -l -E 'id="sales-ledger"|id="store-review-data"' "$HOMEPAGE_REPO_PATH/public/ops" --include="*.html"; then
            echo "::error::Plaintext dashboard content detected"; exit 1
          fi
          git -C "$HOMEPAGE_REPO_PATH" diff --check
          git -C "$HOMEPAGE_REPO_PATH" config user.name "github-actions[bot]"
          git -C "$HOMEPAGE_REPO_PATH" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$HOMEPAGE_REPO_PATH" add public/ops/
          if ! git -C "$HOMEPAGE_REPO_PATH" diff --cached --quiet; then
            git -C "$HOMEPAGE_REPO_PATH" commit -m "Publish sealed Ops dashboard"
            git -C "$HOMEPAGE_REPO_PATH" push origin HEAD:main
          fi

      - name: Verify live ciphertext
        run: |
          python3 scripts/verify_live_ops.py --expected "$HOMEPAGE_REPO_PATH/public/ops/index.html" --attempts 15 --interval 10 --output "$RUNNER_TEMP/ops-sales-verification.json"
