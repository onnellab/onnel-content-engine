name: Collect Sentry Crashes

on: {schedule: [{cron: '20 0 * * *'}], workflow_dispatch: {}}
permissions: {contents: write}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate_crash_source_config.py
      - run: python3 scripts/collect_sentry_crashes.py
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - run: python3 scripts/analyze_incidents.py
      - run: python3 scripts/generate_ai_coder_tasks.py
      - run: python3 scripts/generate_ai_manager_report.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/crash_incidents.csv data/crash_sync_status.json data/ai_doctor_findings.json data/ai_coder_tasks.json data/ai_manager_daily_report.json
          git diff --cached --quiet || git commit -m "Collect Sentry crash incidents"
          git push
