name: Deploy Ops Dashboard

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: onnellab-manual-dashboard-writer
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOMEPAGE_REPO_PATH: .homepage
    steps:
      - name: Checkout content engine
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ONNELLAB_GITHUB_PAGES_TOKEN || github.token }}

      - name: Checkout homepage
        uses: actions/checkout@v4
        with:
          repository: onnellab/onnellab.github.io
          path: ${{ env.HOMEPAGE_REPO_PATH }}
          token: ${{ secrets.ONNELLAB_GITHUB_PAGES_TOKEN || github.token }}

      - name: Refresh main
        run: git pull --ff-only origin main

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build and validate combined ops dashboard
        run: |
          set -euo pipefail
          python3 scripts/build_manual_publish_site.py --homepage-repo "$HOMEPAGE_REPO_PATH"
          python3 scripts/validate_manual_publish_site.py generated/manual-publish/index.html

      - name: Commit combined dashboard snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          python3 scripts/build_manual_publish_site.py --homepage-repo "$HOMEPAGE_REPO_PATH"
          python3 scripts/validate_manual_publish_site.py generated/manual-publish/index.html
          git diff --check
          git add generated/manual-publish/
          if git diff --cached --quiet; then
            echo "No combined dashboard changes to commit"
          else
            git commit -m "Refresh combined operational dashboard"
            git push origin HEAD:main
          fi

      - name: Deploy combined dashboard
        id: homepage_sync
        run: |
          set -euo pipefail
          git -C "$HOMEPAGE_REPO_PATH" pull --rebase --autostash origin main
          mkdir -p "$HOMEPAGE_REPO_PATH/public/ops"
          cp generated/manual-publish/index.html "$HOMEPAGE_REPO_PATH/public/ops/index.html"
          for section in apps publishing media monitoring settings legacy; do
            mkdir -p "$HOMEPAGE_REPO_PATH/public/ops/$section"
            cp -R "generated/manual-publish/$section/." "$HOMEPAGE_REPO_PATH/public/ops/$section/"
          done
          cp generated/manual-publish/manifest.webmanifest "$HOMEPAGE_REPO_PATH/public/ops/manifest.webmanifest"
          cp generated/manual-publish/sw.js "$HOMEPAGE_REPO_PATH/public/ops/sw.js"
          cp generated/manual-publish/icon-180.png "$HOMEPAGE_REPO_PATH/public/ops/icon-180.png"
          cp generated/manual-publish/icon-192.png "$HOMEPAGE_REPO_PATH/public/ops/icon-192.png"
          cp generated/manual-publish/icon-512.png "$HOMEPAGE_REPO_PATH/public/ops/icon-512.png"
          cp generated/manual-publish/libsodium-sumo.js "$HOMEPAGE_REPO_PATH/public/ops/libsodium-sumo.js"
          cp generated/manual-publish/libsodium-wrappers.js "$HOMEPAGE_REPO_PATH/public/ops/libsodium-wrappers.js"
          git -C "$HOMEPAGE_REPO_PATH" config user.name "github-actions[bot]"
          git -C "$HOMEPAGE_REPO_PATH" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/validate_manual_publish_site.py "$HOMEPAGE_REPO_PATH/public/ops/index.html"
          git -C "$HOMEPAGE_REPO_PATH" diff --check
          git -C "$HOMEPAGE_REPO_PATH" add public/ops/
          if git -C "$HOMEPAGE_REPO_PATH" diff --cached --quiet; then
            echo "No combined dashboard deployment changes"
          else
            git -C "$HOMEPAGE_REPO_PATH" commit -m "Refresh combined operational dashboard"
            git -C "$HOMEPAGE_REPO_PATH" push origin HEAD:main
          fi
          echo "sha=$(git -C "$HOMEPAGE_REPO_PATH" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for homepage Pages and live ops verification
        env:
          GH_TOKEN: ${{ secrets.ONNELLAB_GITHUB_PAGES_TOKEN || github.token }}
          HOMEPAGE_SHA: ${{ steps.homepage_sync.outputs.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            echo "Checking homepage deployment ($attempt/60)"
            pages_state="$(
              gh api "repos/onnellab/onnellab.github.io/commits/$HOMEPAGE_SHA/status" \
                --jq '[.statuses[] | select(.context == "onnellab/pages-deploy")][0].state // ""'
            )"
            ops_state="$(
              gh api "repos/onnellab/onnellab.github.io/commits/$HOMEPAGE_SHA/status" \
                --jq '[.statuses[] | select(.context == "onnellab/ops-live-verify")][0].state // ""'
            )"
            if [ "$pages_state" = "success" ] && [ "$ops_state" = "success" ]; then
              echo "Homepage Pages deployment and live /ops/ verification succeeded for $HOMEPAGE_SHA"
              exit 0
            fi
            if [ "$pages_state" = "failure" ] || [ "$pages_state" = "error" ]; then
              echo "::error title=homepage_pages_deploy_failed::Homepage Pages deployment failed for $HOMEPAGE_SHA"
              exit 1
            fi
            if [ "$ops_state" = "failure" ] || [ "$ops_state" = "error" ]; then
              echo "::error title=homepage_ops_live_verify_failed::Homepage live /ops/ verification failed for $HOMEPAGE_SHA"
              exit 1
            fi
            sleep 5
          done
          echo "::error title=homepage_deploy_verification_stale::Homepage Pages deployment or live /ops/ verification did not report success within the bounded verification window"
          exit 1

      - name: Verify live ops deployment
        id: live_ops
        continue-on-error: true
        run: |
          python3 scripts/verify_live_ops.py \
            --expected generated/manual-publish/index.html \
            --output data/ops_live_verification.json \
            --deployment-sha "${{ steps.homepage_sync.outputs.sha }}"

      - name: Commit live ops verification
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f data/ops_live_verification.json ]; then
            echo "No live ops verification record was produced"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add data/ops_live_verification.json
          if ! git diff --cached --quiet; then
            git commit -m "Record live ops verification"
            git push origin HEAD:main
          fi

      - name: Enforce live ops verification
        if: steps.live_ops.outcome != 'success'
        run: exit 1
