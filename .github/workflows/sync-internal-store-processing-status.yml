name: Sync Internal Store Processing Status
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions: {contents: write}
concurrency:
  group: internal-store-processing-status
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - id: collect
        name: Collect official store processing status
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          python3 scripts/collect_internal_store_processing_status.py
          if git diff --quiet -- data/internal_store_processing_status.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.collect.outputs.changed == 'true'
        run: python3 scripts/generate_ai_manager_report.py
      - name: Commit processing audit
        if: steps.collect.outputs.changed == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/internal_store_processing_status.json data/ai_manager_daily_report.json
          git diff --cached --quiet || git commit -m "Sync internal store processing status"
          git pull --rebase --autostash origin main
          git push
