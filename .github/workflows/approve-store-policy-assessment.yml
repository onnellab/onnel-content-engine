name: Approve Store Policy Assessment
on:
  workflow_dispatch:
    inputs:
      task_id: {description: Policy task ID, required: true, type: string}
      approver: {description: Human approver name, required: true, type: string}
      confirm: {description: Type ASSESS to approve read-only assessment, required: true, type: string}
permissions: {contents: write}
jobs:
  approve:
    if: inputs.confirm == 'ASSESS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/approve_store_policy_task.py '${{ inputs.task_id }}' --approver '${{ inputs.approver }}' --confirm
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/store_policy_impact_tasks.json
          git diff --cached --quiet || git commit -m "Approve store policy assessment"
          git push
