<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">如何整理可重复使用的文本片段</title>
  <desc id="desc">只保存稳定不变的表述，标出每次要修改的信息，并另行记录适用场景。发送前确认收件人、替换所有占位符，再通读完整消息。依据发生变化时，也要复查保存的文字。</desc>
  <rect width="1200" height="675" fill="#fbf7ef"/>
  <rect x="54" y="48" width="1092" height="579" rx="28" fill="#f7f2e9" stroke="#ded7ca" stroke-width="1.8"/>
  <text fill="#30302c" font-family="Noto Sans CJK SC, system-ui, sans-serif" font-size="38" font-weight="680"><tspan x="92" y="100">如何整理可重复使用的文本片段</tspan></text>
  <text fill="#69645c" font-family="Noto Sans CJK SC, system-ui, sans-serif" font-size="19"><tspan x="92" y="134">发送前 · 可重复使用的文本片段</tspan></text>
  <g transform="translate(72 162)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Noto Sans CJK SC, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">1. 选择</tspan></text><text fill="#5f5b54" font-family="Noto Sans CJK SC, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">选择稳定表述</tspan></text></g><g transform="translate(346 162)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Noto Sans CJK SC, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">2. 标记</tspan></text><text fill="#5f5b54" font-family="Noto Sans CJK SC, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">标出变化信息</tspan></text></g><g transform="translate(620 162)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Noto Sans CJK SC, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">3. 检查</tspan></text><text fill="#5f5b54" font-family="Noto Sans CJK SC, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">检查粘贴目标</tspan></text></g><g transform="translate(894 162)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Noto Sans CJK SC, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">4. 复查</tspan></text><text fill="#5f5b54" font-family="Noto Sans CJK SC, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">复查保存内容</tspan></text></g>
  <path d="M280 237H328m-10-11 12 11-12 11" fill="none" stroke="#8c867b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M554 237H602m-10-11 12 11-12 11" fill="none" stroke="#8c867b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M828 237H876m-10-11 12 11-12 11" fill="none" stroke="#8c867b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="92" y="456" width="1016" height="82" rx="18" fill="#e7f2fb" stroke="#b9d7ea" stroke-width="1.6"/>
  <text x="124" y="506" fill="#30302c" font-family="Noto Sans CJK SC, system-ui, sans-serif" font-size="20" font-weight="650">每次粘贴后都要检查。</text>
  <text x="92" y="588" fill="#817c73" font-family="Noto Sans CJK SC, system-ui, sans-serif" font-size="14">ONNELLAB Blog · 流程图</text>
</svg>
