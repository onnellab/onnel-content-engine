<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">检查 EPUB 的目录链接和章节顺序</title>
  <desc id="desc">列出预期章节，检查全部目录链接和连续阅读顺序，再生成 EPUB 并重新检查。</desc>
  <rect width="1200" height="675" fill="#fbf7ef"/>
  <rect x="54" y="48" width="1092" height="579" rx="28" fill="#f7f2e9" stroke="#ded7ca" stroke-width="1.8"/>
  <text fill="#30302c" font-family="Noto Sans CJK SC, system-ui, sans-serif" font-size="38" font-weight="680"><tspan x="92" y="100">检查 EPUB 的目录链接和章节顺序</tspan></text>
  <text fill="#69645c" font-family="Noto Sans CJK SC, system-ui, sans-serif" font-size="19"><tspan x="92" y="134">EPUB 输出检查 · EPUB 目录检查</tspan></text>
  <g transform="translate(72 162)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Noto Sans CJK SC, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">1. 预期</tspan></text><text fill="#5f5b54" font-family="Noto Sans CJK SC, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">列出章节清单</tspan></text></g><g transform="translate(346 162)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Noto Sans CJK SC, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">2. 链接</tspan></text><text fill="#5f5b54" font-family="Noto Sans CJK SC, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">核对全部目标</tspan></text></g><g transform="translate(620 162)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Noto Sans CJK SC, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">3. 顺序</tspan></text><text fill="#5f5b54" font-family="Noto Sans CJK SC, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">连续跨章阅读</tspan></text></g><g transform="translate(894 162)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Noto Sans CJK SC, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">4. 再生成</tspan></text><text fill="#5f5b54" font-family="Noto Sans CJK SC, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">导出后重新检查</tspan></text></g>
  <path d="M280 237H328m-10-11 12 11-12 11" fill="none" stroke="#8c867b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M554 237H602m-10-11 12 11-12 11" fill="none" stroke="#8c867b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M828 237H876m-10-11 12 11-12 11" fill="none" stroke="#8c867b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="92" y="456" width="1016" height="82" rx="18" fill="#e7f2fb" stroke="#b9d7ea" stroke-width="1.6"/>
  <text x="124" y="506" fill="#30302c" font-family="Noto Sans CJK SC, system-ui, sans-serif" font-size="20" font-weight="650">修改原稿后，重新检查新生成的 EPUB。</text>
  <text x="92" y="588" fill="#817c73" font-family="Noto Sans CJK SC, system-ui, sans-serif" font-size="14">ONNELLAB Blog · 流程图</text>
</svg>
