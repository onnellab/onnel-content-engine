<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">明确不确定之处</title>
  <desc id="desc">标明未确认、说法不一致或暂定解释，写清原因、证据来源和下一步核查。更新笔记时保留先前判断的理由。这些标签描述调查状态，并不代表测量得到的概率。</desc>
  <rect width="1200" height="675" fill="#fbf7ef"/>
  <rect x="54" y="48" width="1092" height="579" rx="28" fill="#f7f2e9" stroke="#ded7ca" stroke-width="1.8"/>
  <text fill="#30302c" font-family="Noto Sans CJK SC, system-ui, sans-serif" font-size="38" font-weight="680"><tspan x="92" y="100">明确不确定之处</tspan></text>
  <text fill="#69645c" font-family="Noto Sans CJK SC, system-ui, sans-serif" font-size="19"><tspan x="92" y="134">主张、证据、原因、下一步核查 · 研究笔记中的不确定性</tspan></text>
