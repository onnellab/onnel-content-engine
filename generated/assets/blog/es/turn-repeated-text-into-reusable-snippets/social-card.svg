<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Cómo convertir textos repetidos en fragmentos reutilizables</title>
  <desc id="desc">Prepara fragmentos reutilizables con contexto, marcadores visibles y una revisión antes de enviar. Mantén una colección pequeña y actualizada.</desc>
