  <text x="92" y="218" fill="#282723" font-family="Inter, system-ui, sans-serif" font-size="54" font-weight="760"><tspan x="92" y="218">Cómo convertir textos</tspan><tspan x="92" y="282">repetidos en fragmentos</tspan><tspan x="92" y="346">reutilizables</tspan></text>
  <text fill="#5f5b54" font-family="Inter, system-ui, sans-serif" font-size="24"><tspan x="92" y="410">Prepara fragmentos reutilizables con contexto, marcadores</tspan><tspan x="92" y="444">visibles y una revisión antes de enviar. Mantén una</tspan><tspan x="92" y="478">colección pequeña y actualizada.</tspan></text>
