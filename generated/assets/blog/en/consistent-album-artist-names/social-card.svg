<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Consistent Album and Artist Tags Without Losing Track Credits</title>
  <desc id="desc">Correct inconsistent album and artist tags on working copies, preserve track-specific credits, and verify saved files before updating a music library.</desc>
  <rect width="1200" height="630" fill="#f8f4ec"/>
  <rect x="58" y="54" width="1084" height="522" rx="30" fill="#fffdf8" stroke="#d8d0c3" stroke-width="2"/>
  <rect x="92" y="92" width="210" height="44" rx="22" fill="#f3e9fb" stroke="#d8c3ec" stroke-width="1.4"/>
  <text x="118" y="121" fill="#4e3568" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">MUSIC</text>
  <text x="92" y="218" fill="#282723" font-family="Inter, system-ui, sans-serif" font-size="54" font-weight="760"><tspan x="92" y="218">Consistent Album and</tspan><tspan x="92" y="282">Artist Tags Without</tspan><tspan x="92" y="346">Losing Track Credits</tspan></text>
  <text fill="#5f5b54" font-family="Inter, system-ui, sans-serif" font-size="24"><tspan x="92" y="410">Correct inconsistent album and artist tags on working</tspan><tspan x="92" y="444">copies, preserve track-specific credits, and verify saved</tspan><tspan x="92" y="478">files before updating a music library.</tspan></text>
  <path d="M92 518H1108" stroke="#ded7ca" stroke-width="2"/>
  <text x="92" y="552" fill="#817c73" font-family="Inter, system-ui, sans-serif" font-size="19">MUSIC · EN</text>
  <text x="1048" y="552" fill="#30302c" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="800" text-anchor="end">ONNELLAB</text>
</svg>
