<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">如何整理可重複使用的文字片段</title>
  <desc id="desc">只儲存固定不變的表述，標示每次要修改的資訊，並另外記錄適用情境。傳送前確認收件人、替換所有預留位置，再讀過完整訊息。依據改變時，也要重新檢查儲存的文字。</desc>
  <rect width="1200" height="675" fill="#fbf7ef"/>
  <rect x="54" y="48" width="1092" height="579" rx="28" fill="#f7f2e9" stroke="#ded7ca" stroke-width="1.8"/>
  <text fill="#30302c" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="38" font-weight="680"><tspan x="92" y="100">如何整理可重複使用的文字片段</tspan></text>
  <text fill="#69645c" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="19"><tspan x="92" y="134">傳送前 · 可重複使用的文字片段</tspan></text>
  <g transform="translate(72 162)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">1. 選擇</tspan></text><text fill="#5f5b54" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">選擇固定表述</tspan></text></g><g transform="translate(346 162)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">2. 標示</tspan></text><text fill="#5f5b54" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">標示變動資訊</tspan></text></g><g transform="translate(620 162)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">3. 檢查</tspan></text><text fill="#5f5b54" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">檢查貼上位置</tspan></text></g><g transform="translate(894 162)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">4. 複查</tspan></text><text fill="#5f5b54" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">檢查儲存內容</tspan></text></g>
  <path d="M280 237H328m-10-11 12 11-12 11" fill="none" stroke="#8c867b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M554 237H602m-10-11 12 11-12 11" fill="none" stroke="#8c867b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M828 237H876m-10-11 12 11-12 11" fill="none" stroke="#8c867b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="92" y="456" width="1016" height="82" rx="18" fill="#e7f2fb" stroke="#b9d7ea" stroke-width="1.6"/>
  <text x="124" y="506" fill="#30302c" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="20" font-weight="650">每次貼上後都要檢查。</text>
  <text x="92" y="588" fill="#817c73" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="14">ONNELLAB Blog · 流程圖</text>
</svg>
