<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">如何在長篇純文字文件中找回需要的段落</title>
  <desc id="desc">不修改原始檔案，運用現有標題、搜尋詞與位置筆記，依五個步驟找回長篇TXT文件中的內容。</desc>
  <rect width="1200" height="630" fill="#f8f4ec"/>
  <rect x="58" y="54" width="1084" height="522" rx="30" fill="#fffdf8" stroke="#d8d0c3" stroke-width="2"/>
  <rect x="92" y="92" width="210" height="44" rx="22" fill="#e7f2fb" stroke="#b9d7ea" stroke-width="1.4"/>
  <text x="118" y="121" fill="#24465c" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="18" font-weight="700">閱讀</text>
  <text x="92" y="218" fill="#282723" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="54" font-weight="760"><tspan x="92" y="218">如何在長篇純文字文件中找回需要的段</tspan><tspan x="92" y="282">落</tspan></text>
  <text fill="#5f5b54" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="24"><tspan x="92" y="410">不修改原始檔案，運用現有標題、搜尋詞與位置筆記，依五個步驟找回長篇TXT文件中</tspan><tspan x="92" y="444">的內容。</tspan></text>
  <path d="M92 518H1108" stroke="#ded7ca" stroke-width="2"/>
  <text x="92" y="552" fill="#817c73" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="19">閱讀 · ZH-HANT</text>
  <text x="1048" y="552" fill="#30302c" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="19" font-weight="800" text-anchor="end">ONNELLAB</text>
</svg>
