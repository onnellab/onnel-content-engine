<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">建立一致的檔案命名規則</title>
  <desc id="desc">選擇少量意思明確的欄位，每次都依固定順序排列。使用穩定的識別資訊、意思清楚的日期、位數一致的序號，以及與核准狀態分開的修訂編號；寫下簡短規則與範例，再用五個具代表性的檔案測試。</desc>
  <rect width="1200" height="675" fill="#fbf7ef"/>
  <rect x="54" y="48" width="1092" height="579" rx="28" fill="#f7f2e9" stroke="#ded7ca" stroke-width="1.8"/>
  <text fill="#30302c" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="38" font-weight="680"><tspan x="92" y="100">建立一致的檔案命名規則</tspan></text>
  <text fill="#69645c" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="19"><tspan x="92" y="134">先定義欄位的意思 · 檔案命名規則</tspan></text>
  <g transform="translate(72 162)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">1. 識別</tspan></text><text fill="#5f5b54" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">固定指向的對象</tspan></text></g><g transform="translate(346 162)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">2. 日期</tspan></text><text fill="#5f5b54" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">定義日期的意思</tspan></text></g><g transform="translate(620 162)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">3. 順序</tspan></text><text fill="#5f5b54" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">統一數字位數</tspan></text></g><g transform="translate(894 162)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">4. 修訂</tspan></text><text fill="#5f5b54" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">標示修訂編號</tspan></text></g>
  <path d="M280 237H328m-10-11 12 11-12 11" fill="none" stroke="#8c867b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M554 237H602m-10-11 12 11-12 11" fill="none" stroke="#8c867b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M828 237H876m-10-11 12 11-12 11" fill="none" stroke="#8c867b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="92" y="456" width="1016" height="82" rx="18" fill="#e7f2fb" stroke="#b9d7ea" stroke-width="1.6"/>
  <text x="124" y="506" fill="#30302c" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="20" font-weight="650">一個欄位，一種意思</text>
  <text x="92" y="588" fill="#817c73" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="14">ONNELLAB Blog · 流程圖</text>
</svg>
