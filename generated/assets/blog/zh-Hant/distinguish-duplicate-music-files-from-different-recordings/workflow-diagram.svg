<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">刪除之前先比較</title>
  <desc id="desc">先保留兩個檔案，再核對來源、版本標示，並試聽對應片段。將檔案是否相同與錄音是否相同分開判斷；僅憑標題、長度或標籤無法確定時，保留兩份並記下疑問。</desc>
  <rect width="1200" height="675" fill="#fbf7ef"/>
  <rect x="54" y="48" width="1092" height="579" rx="28" fill="#f7f2e9" stroke="#ded7ca" stroke-width="1.8"/>
  <text fill="#30302c" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="38" font-weight="680"><tspan x="92" y="100">刪除之前先比較</tspan></text>
  <text fill="#69645c" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="19"><tspan x="92" y="134">檔案、發行版本與錄音並不相同 · 音樂檔案</tspan></text>
  <g transform="translate(72 162)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">保留</tspan></text><text fill="#5f5b54" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">保存原檔與備份</tspan></text></g><g transform="translate(346 162)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">比較</tspan></text><text fill="#5f5b54" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">核對版本與來源</tspan></text></g><g transform="translate(620 162)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">試聽</tspan></text><text fill="#5f5b54" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">比較相同片段</tspan></text></g><g transform="translate(894 162)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">記錄</tspan></text><text fill="#5f5b54" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">保留依據與疑問</tspan></text></g>
  <path d="M280 237H328m-10-11 12 11-12 11" fill="none" stroke="#8c867b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M554 237H602m-10-11 12 11-12 11" fill="none" stroke="#8c867b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M828 237H876m-10-11 12 11-12 11" fill="none" stroke="#8c867b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="92" y="456" width="1016" height="82" rx="18" fill="#e7f2fb" stroke="#b9d7ea" stroke-width="1.6"/>
  <text x="124" y="506" fill="#30302c" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="20" font-weight="650">保留無法確定的副本。</text>
  <text x="92" y="588" fill="#817c73" font-family="Noto Sans CJK TC, system-ui, sans-serif" font-size="14">ONNELLAB Blog · 流程圖</text>
</svg>
