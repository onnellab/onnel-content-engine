<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Como separar as anotações sobre fontes das suas conclusões</title>
  <desc id="desc">Mantenha citações, paráfrases e interpretações próprias separadas, com referências precisas aos trechos, uma tabela prática de comparação e um fluxo de cinco etapas para anotações de pesquisa.</desc>
  <rect width="1200" height="630" fill="#f8f4ec"/>
  <rect x="58" y="54" width="1084" height="522" rx="30" fill="#fffdf8" stroke="#d8d0c3" stroke-width="2"/>
  <rect x="92" y="92" width="210" height="44" rx="22" fill="#e9f3f1" stroke="#b9d8d2" stroke-width="1.4"/>
  <text x="118" y="121" fill="#244f4a" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Pesquisa</text>
  <text x="92" y="218" fill="#282723" font-family="Inter, system-ui, sans-serif" font-size="54" font-weight="760"><tspan x="92" y="218">Como separar as anotações</tspan><tspan x="92" y="282">sobre fontes das suas</tspan><tspan x="92" y="346">conclusões</tspan></text>
  <text fill="#5f5b54" font-family="Inter, system-ui, sans-serif" font-size="20"><tspan x="92" y="410">Mantenha citações, paráfrases e interpretações próprias separadas,</tspan><tspan x="92" y="440">com referências precisas aos trechos, uma tabela prática de comparação</tspan><tspan x="92" y="470">e um fluxo de cinco etapas para anotações de pesquisa.</tspan></text>
  <path d="M92 518H1108" stroke="#ded7ca" stroke-width="2"/>
  <text x="92" y="552" fill="#817c73" font-family="Inter, system-ui, sans-serif" font-size="19">Pesquisa · PT-BR</text>
  <text x="1048" y="552" fill="#30302c" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="800" text-anchor="end">ONNELLAB</text>
</svg>
