<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Como indicar incertezas nas notas de pesquisa</title>
  <desc id="desc">Diferencie informações não confirmadas, relatos divergentes e interpretações provisórias, registrando a próxima verificação de cada questão.</desc>
  <rect width="1200" height="630" fill="#f8f4ec"/>
  <rect x="58" y="54" width="1084" height="522" rx="30" fill="#fffdf8" stroke="#d8d0c3" stroke-width="2"/>
  <rect x="92" y="92" width="210" height="44" rx="22" fill="#e9f3f1" stroke="#b9d8d2" stroke-width="1.4"/>
  <text x="118" y="121" fill="#244f4a" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Pesquisa</text>
  <text x="92" y="218" fill="#282723" font-family="Inter, system-ui, sans-serif" font-size="54" font-weight="760"><tspan x="92" y="218">Como indicar incertezas</tspan><tspan x="92" y="282">nas notas de pesquisa</tspan></text>
  <text fill="#5f5b54" font-family="Inter, system-ui, sans-serif" font-size="24"><tspan x="92" y="410">Diferencie informações não confirmadas, relatos</tspan><tspan x="92" y="444">divergentes e interpretações provisórias, registrando a</tspan><tspan x="92" y="478">próxima verificação de cada questão.</tspan></text>
