<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Como organizar músicas no Android para ouvir offline</title>
  <desc id="desc">Organize uma pequena coleção de arquivos locais e confira a reprodução sem conexão antes de depender dela longe da internet.</desc>
  <rect width="1200" height="630" fill="#f8f4ec"/>
  <rect x="58" y="54" width="1084" height="522" rx="30" fill="#fffdf8" stroke="#d8d0c3" stroke-width="2"/>
  <rect x="92" y="92" width="210" height="44" rx="22" fill="#f3e9fb" stroke="#d8c3ec" stroke-width="1.4"/>
  <text x="118" y="121" fill="#4e3568" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Música</text>
  <text x="92" y="218" fill="#282723" font-family="Inter, system-ui, sans-serif" font-size="54" font-weight="760"><tspan x="92" y="218">Como organizar músicas</tspan><tspan x="92" y="282">no Android para ouvir</tspan><tspan x="92" y="346">offline</tspan></text>
  <text fill="#5f5b54" font-family="Inter, system-ui, sans-serif" font-size="24"><tspan x="92" y="410">Organize uma pequena coleção de arquivos locais e confira a</tspan><tspan x="92" y="444">reprodução sem conexão antes de depender dela longe da</tspan><tspan x="92" y="478">internet.</tspan></text>
