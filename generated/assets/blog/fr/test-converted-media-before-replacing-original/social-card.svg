<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Tester un fichier multimédia converti avant de remplacer l’original</title>
  <desc id="desc">Vérifiez le contenu, la lecture et les métadonnées nécessaires après une conversion audio ou vidéo. Testez le fichier dans l’application prévue et conservez une sauvegarde vérifiée.</desc>
  <rect width="1200" height="630" fill="#f8f4ec"/>
  <rect x="58" y="54" width="1084" height="522" rx="30" fill="#fffdf8" stroke="#d8d0c3" stroke-width="2"/>
  <rect x="92" y="92" width="210" height="44" rx="22" fill="#fff0df" stroke="#edcda6" stroke-width="1.4"/>
  <text x="118" y="121" fill="#684621" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Médias</text>
  <text x="92" y="218" fill="#282723" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="760"><tspan x="92" y="218">Tester un fichier</tspan><tspan x="92" y="276">multimédia converti avant de</tspan><tspan x="92" y="334">remplacer l’original</tspan></text>
  <text fill="#5f5b54" font-family="Inter, system-ui, sans-serif" font-size="22"><tspan x="92" y="410">Vérifiez le contenu, la lecture et les métadonnées nécessaires</tspan><tspan x="92" y="442">après une conversion audio ou vidéo. Testez le fichier dans</tspan><tspan x="92" y="474">l’application prévue et conservez une sauvegarde vérifiée.</tspan></text>
  <path d="M92 518H1108" stroke="#ded7ca" stroke-width="2"/>
  <text x="92" y="552" fill="#817c73" font-family="Inter, system-ui, sans-serif" font-size="19">Médias · FR</text>
  <text x="1048" y="552" fill="#30302c" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="800" text-anchor="end">ONNELLAB</text>
</svg>
