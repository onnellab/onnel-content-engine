<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Vérifier la table des matières et l’ordre des chapitres d’un EPUB</title>
  <desc id="desc">Comparez l’EPUB exporté à la liste prévue et vérifiez séparément les liens de la table des matières et l’ordre de lecture.</desc>
  <rect width="1200" height="630" fill="#f8f4ec"/>
  <rect x="58" y="54" width="1084" height="522" rx="30" fill="#fffdf8" stroke="#d8d0c3" stroke-width="2"/>
  <rect x="92" y="92" width="210" height="44" rx="22" fill="#e7f2fb" stroke="#b9d7ea" stroke-width="1.4"/>
  <text x="118" y="121" fill="#24465c" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Lecture</text>
  <text x="92" y="218" fill="#282723" font-family="Inter, system-ui, sans-serif" font-size="54" font-weight="760"><tspan x="92" y="218">Vérifier la table des</tspan><tspan x="92" y="282">matières et l’ordre des</tspan><tspan x="92" y="346">chapitres d’un EPUB</tspan></text>
  <text fill="#5f5b54" font-family="Inter, system-ui, sans-serif" font-size="24"><tspan x="92" y="410">Comparez l’EPUB exporté à la liste prévue et vérifiez</tspan><tspan x="92" y="444">séparément les liens de la table des matières et l’ordre de</tspan><tspan x="92" y="478">lecture.</tspan></text>
  <path d="M92 518H1108" stroke="#ded7ca" stroke-width="2"/>
  <text x="92" y="552" fill="#817c73" font-family="Inter, system-ui, sans-serif" font-size="19">Lecture · FR</text>
  <text x="1048" y="552" fill="#30302c" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="800" text-anchor="end">ONNELLAB</text>
</svg>
