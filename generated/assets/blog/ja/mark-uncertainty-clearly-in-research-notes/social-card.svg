  <text x="124" y="506" fill="#30302c" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="20" font-weight="650">未解決の問いを見える状態にします。</text>
  <text x="92" y="588" fill="#817c73" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="14">ONNELLAB Blog · 手順図</text>
