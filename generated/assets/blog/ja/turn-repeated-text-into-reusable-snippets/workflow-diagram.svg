<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">繰り返し使う文章を定型文に整理する方法</title>
  <desc id="desc">変わらない表現だけを保存し、毎回変える箇所に印を付け、使う場面を別に記録します。送信前に宛先を確認し、すべての印を実際の情報に置き換えて、全文を読み直します。根拠となる情報が変わったら保存文も見直します。</desc>
  <rect width="1200" height="675" fill="#fbf7ef"/>
  <rect x="54" y="48" width="1092" height="579" rx="28" fill="#f7f2e9" stroke="#ded7ca" stroke-width="1.8"/>
  <text fill="#30302c" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="38" font-weight="680"><tspan x="92" y="100">繰り返し使う文章を定型文に整理する方法</tspan></text>
  <text fill="#69645c" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="19"><tspan x="92" y="134">送信前に · 再利用できる定型文</tspan></text>
  <g transform="translate(72 162)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">1. 選ぶ</tspan></text><text fill="#5f5b54" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">変わらない表現を</tspan><tspan x="24" y="105">選ぶ</tspan></text></g><g transform="translate(346 162)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="35">2.</tspan><tspan x="24" y="59">印を付ける</tspan></text><text fill="#5f5b54" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">差し替える箇所に</tspan><tspan x="24" y="105">印を付ける</tspan></text></g><g transform="translate(620 162)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">3. 確認する</tspan></text><text fill="#5f5b54" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">貼り付け先を確認</tspan><tspan x="24" y="105">する</tspan></text></g><g transform="translate(894 162)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">4. 見直す</tspan></text><text fill="#5f5b54" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">保存文を見直す</tspan></text></g>
  <path d="M280 237H328m-10-11 12 11-12 11" fill="none" stroke="#8c867b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M554 237H602m-10-11 12 11-12 11" fill="none" stroke="#8c867b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M828 237H876m-10-11 12 11-12 11" fill="none" stroke="#8c867b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="92" y="456" width="1016" height="82" rx="18" fill="#e7f2fb" stroke="#b9d7ea" stroke-width="1.6"/>
  <text x="124" y="506" fill="#30302c" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="20" font-weight="650">貼り付けた文章は毎回確認します。</text>
  <text x="92" y="588" fill="#817c73" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="14">ONNELLAB Blog · 手順図</text>
</svg>
