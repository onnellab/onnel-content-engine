<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">名前をそろえ、クレジットを守る</title>
  <desc id="desc">対象のリリースを正確に特定し、確認済みのアルバム名にそろえつつ、各曲に記載されたアーティストは保持します。作業用コピーを編集し、共通の値は該当するファイルにだけ適用してから、保存結果を開き直し、使っているプレーヤーで確認します。</desc>
  <rect width="1200" height="675" fill="#fbf7ef"/>
  <rect x="54" y="48" width="1092" height="579" rx="28" fill="#f7f2e9" stroke="#ded7ca" stroke-width="1.8"/>
  <text fill="#30302c" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="38" font-weight="680"><tspan x="92" y="100">名前をそろえ、クレジットを守る</tspan></text>
  <text fill="#69645c" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="19"><tspan x="92" y="134">タグを編集する前にリリースを確認 · アルバム名とアーティスト名のタグを整える</tspan></text>
  <g transform="translate(72 162)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">1. 特定</tspan></text><text fill="#5f5b54" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">対象のリリースを</tspan><tspan x="24" y="105">正確に確認</tspan></text></g><g transform="translate(346 162)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">2. 比較</tspan></text><text fill="#5f5b54" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">共通項目と個別項</tspan><tspan x="24" y="105">目を分ける</tspan></text></g><g transform="translate(620 162)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">3. 保存</tspan></text><text fill="#5f5b54" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">少数の作業用ファ</tspan><tspan x="24" y="105">イルを変更</tspan></text></g><g transform="translate(894 162)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">4. 検証</tspan></text><text fill="#5f5b54" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">ファイルを開き直</tspan><tspan x="24" y="105">し、プレーヤーで</tspan><tspan x="24" y="126">確認</tspan></text></g>
  <path d="M280 237H328m-10-11 12 11-12 11" fill="none" stroke="#8c867b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M554 237H602m-10-11 12 11-12 11" fill="none" stroke="#8c867b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M828 237H876m-10-11 12 11-12 11" fill="none" stroke="#8c867b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="92" y="456" width="1016" height="82" rx="18" fill="#e7f2fb" stroke="#b9d7ea" stroke-width="1.6"/>
  <text x="124" y="506" fill="#30302c" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="20" font-weight="650">アルバム情報は共通化し、曲ごとの違いは保持。</text>
  <text x="92" y="588" fill="#817c73" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="14">ONNELLAB Blog · 手順図</text>
</svg>
