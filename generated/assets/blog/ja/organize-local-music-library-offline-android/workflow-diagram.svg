<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Androidの音楽ファイルをオフライン再生用に整理 する方法</title>
  <desc id="desc">原本を保管し、少数のローカルファイルを追加してオフライン再生を確認し、段階的に増やして再確認します。</desc>
  <rect width="1200" height="675" fill="#fbf7ef"/>
  <rect x="54" y="48" width="1092" height="579" rx="28" fill="#f7f2e9" stroke="#ded7ca" stroke-width="1.8"/>
  <text fill="#30302c" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="38" font-weight="680"><tspan x="92" y="100">Androidの音楽ファイルをオフライン再生用に整理</tspan><tspan x="92" y="145">する方法</tspan></text>
  <text fill="#69645c" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="19"><tspan x="92" y="179">オフライン音楽の確認 · Androidの音楽ファイルを整理</tspan></text>
  <g transform="translate(72 207)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">1. 保管</tspan></text><text fill="#5f5b54" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">原本を別に保存</tspan></text></g><g transform="translate(346 207)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">2. 追加</tspan></text><text fill="#5f5b54" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">少数のローカル曲</tspan></text></g><g transform="translate(620 207)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">3. 確認</tspan></text><text fill="#5f5b54" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">オフライン再生</tspan></text></g><g transform="translate(894 207)"><rect width="190" height="150" rx="18" fill="#fffdf8" stroke="#d8d0c3" stroke-width="1.6"/><text x="24" y="48" fill="#30302c" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="20" font-weight="650"><tspan x="24" y="48">4. 拡大</tspan></text><text fill="#5f5b54" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="15"><tspan x="24" y="84">少しずつ再確認</tspan></text></g>
  <path d="M280 282H328m-10-11 12 11-12 11" fill="none" stroke="#8c867b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M554 282H602m-10-11 12 11-12 11" fill="none" stroke="#8c867b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M828 282H876m-10-11 12 11-12 11" fill="none" stroke="#8c867b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="92" y="456" width="1016" height="82" rx="18" fill="#e7f2fb" stroke="#b9d7ea" stroke-width="1.6"/>
  <text x="124" y="506" fill="#30302c" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="20" font-weight="650">原本を残し、少数ずつ追加して再確認しましょう。</text>
  <text x="92" y="588" fill="#817c73" font-family="Noto Sans CJK JP, system-ui, sans-serif" font-size="14">ONNELLAB Blog · 手順図</text>
</svg>
