<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Konvertierte Mediendateien prüfen, bevor Sie das Original ersetzen</title>
  <desc id="desc">Prüfen Sie konvertierte Audio- und Videodateien auf Vollständigkeit, Wiedergabe und benötigte Metadaten. Testen Sie die Datei in der Zielanwendung und sichern Sie das Original.</desc>
  <rect width="1200" height="630" fill="#f8f4ec"/>
  <rect x="58" y="54" width="1084" height="522" rx="30" fill="#fffdf8" stroke="#d8d0c3" stroke-width="2"/>
  <rect x="92" y="92" width="210" height="44" rx="22" fill="#fff0df" stroke="#edcda6" stroke-width="1.4"/>
  <text x="118" y="121" fill="#684621" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Medien</text>
  <text x="92" y="218" fill="#282723" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="760"><tspan x="92" y="218">Konvertierte Mediendateien</tspan><tspan x="92" y="276">prüfen, bevor Sie das</tspan><tspan x="92" y="334">Original ersetzen</tspan></text>
  <text fill="#5f5b54" font-family="Inter, system-ui, sans-serif" font-size="22"><tspan x="92" y="410">Prüfen Sie konvertierte Audio- und Videodateien auf</tspan><tspan x="92" y="442">Vollständigkeit, Wiedergabe und benötigte Metadaten. Testen</tspan><tspan x="92" y="474">Sie die Datei in der Zielanwendung und sichern Sie das Original.</tspan></text>
  <path d="M92 518H1108" stroke="#ded7ca" stroke-width="2"/>
  <text x="92" y="552" fill="#817c73" font-family="Inter, system-ui, sans-serif" font-size="19">Medien · DE</text>
  <text x="1048" y="552" fill="#30302c" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="800" text-anchor="end">ONNELLAB</text>
</svg>
